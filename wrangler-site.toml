# Renamed from timothystl-site 2026-09-28, in place, via the Cloudflare dashboard (Worker Settings
# -> General -> Name) BEFORE this file was merged: deploying this name first would create a new
# Worker with no custom domains or routes. Same script, domains, and settings after the rename.
name = "timothy-website"
main = "site-worker.js"
compatibility_date = "2024-01-01"

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

[assets]
directory = "./public"
not_found_handling = "single-page-application"
binding = "ASSETS"
# Without this, Cloudflare serves a matching static asset (e.g. "/" -> index.html)
# directly at the edge and never invokes this Worker's fetch handler at all — which
# silently broke give.timothystl.org's hostname check (and, less visibly, the existing
# www->apex redirect and every custom Redirects-tab entry) since "/" always matches
# index.html regardless of which hostname the request came in on. Found 2026-07-27
# when give.timothystl.org was serving the main homepage instead of the giving page.
run_worker_first = true
