        (S.editors || []).map(function (u) {
          return '<option value="' + esc(u) + '"' + (u === m.owner_username ? ' selected' : '') + '>' + esc(u) + '</option>';
        }).join('') +
      '</select>' +
      '<span class="ed-note">Hand a page to one person and it is the only page they see.</span>' +
    '</div>' : '') +
        (S.hasRedesign ? '<div class="ed-sec ed-sec--rule">' +
      '<span class="ed-lab">The redesigned layout</span>' +
      '<span class="ed-note">There is a redesigned version of this page waiting \u2014 the photo banner, the cards and the overlays, laid out by the designer. Putting it here replaces the blocks on this page with it.</span>' +
      '<button type="button" class="ed-reset" id="edUseRedesign">Use the redesigned layout</button>' +
      '<span class="ed-note">It goes into your draft only, so the live page does not change until you press Publish. What is on the page now is saved to the version history first, so you can put it back.</span>' +
    '</div>' : '') +
'<div class="ed-sec ed-sec--rule">' +
      '<span class="ed-lab">Publishing</span>' +
      '<span class="ed-read" id="edPageSaved">' + (S.savingPage ? 'Saving\u2026' : 'Saved') + '</span>' +
      '<button type="button" class="ed-danger" id="edPageDelete">Delete this page</button>' +
      '<span class="ed-note">' + (m.locked
        ? 'This page is part of the site\u2019s structure and cannot be deleted.'
        : 'The page and everything on it. Its address will start showing the \u201Cpage not found\u201D screen.') + '</span>' +
    '</div>';
}

function renderInspector() {
  // Rebuilding the panel loses focus; put it back on the same control so the
  // keyboard path through a stepper or a swatch row survives a re-render.
  var active = document.activeElement;
  var focusKey = active && active.closest && active.closest('#edInspBody') ? active.getAttribute('data-k') : null;

  if (el.edTabBlock) {
    el.edTabBlock.setAttribute('aria-selected', String(S.tab === 'block'));
    el.edTabPage.setAttribute('aria-selected', String(S.tab === 'page'));
  }
  if (S.tab === 'page') {
    el.edInspHead.innerHTML = '';
    el.edInspBody.className = 'ed-insp-body';
    el.edInspBody.innerHTML = pageTabHtml();
    return;
  }

  var b = findBlock(S.selectedId);
  if (!b) {
    el.edInspHead.innerHTML = '';
    el.edInspBody.className = 'ed-none';
    el.edInspBody.innerHTML = '<b>Nothing selected</b><span>Click a block on the page — or a row in the left rail — to change its layout, spacing, and background.</span>';
    return;
  }
  var d = def(b.type);
  el.edInspHead.innerHTML = '<div class="ed-insp-h"><b>' + esc(d.label) + '</b>' +
    '<span>Block ' + (indexOfBlock(b.id) + 1) + ' of ' + S.blocks.length + '</span></div>';
  el.edInspBody.className = 'ed-insp-body';
  el.edInspBody.innerHTML = inspectorSections(b, d);

  if (focusKey) {
    var back = el.edInspBody.querySelector('[data-k="' + focusKey.replace(/"/g, '') + '"]');
    if (back) back.focus();
  }
}

function chip(action, value, label, on, extra) {
  return '<button type="button" class="ed-pick" data-a="' + action + '" data-v="' + esc(value) + '"' +
    ' data-k="' + action + ':' + esc(value) + '" aria-pressed="' + (on ? 'true' : 'false') + '"' +
    (extra || '') + '>' + esc(label) + '</button>';
}

function stepper(b, key, label) {
  return '<div class="ed-step-row"><span>' + esc(label) + '</span>' +
    '<span class="ed-step">' +
      '<button type="button" data-a="step" data-v="' + key + ':-1" data-k="step:' + key + ':-1" aria-label="Less ' + esc(label.toLowerCase()) + '">−</button>' +
      '<output>' + b[key] + 'px</output>' +
      '<button type="button" data-a="step" data-v="' + key + ':1" data-k="step:' + key + ':1" aria-label="More ' + esc(label.toLowerCase()) + '">+</button>' +
    '</span></div>';
}

function inspectorSections(b, d) {
  var C = S.config;
  var out = '';

  // Locking is the office's own control: it marks a block as part of the site's
  // design so whoever the page is handed to can edit around it but not remove
  // it. Nobody else sees this, because for them it is not a choice.
  var lockRow = S.role === 'office' && IS_SITE_PAGE
    ? '<div class="ed-sec ed-sec--rule"><label class="ed-check">' +
        '<input type="checkbox" data-in="locked"' + (b.locked ? ' checked' : '') + '>' +
        'Set by the church office</label>' +
        '<span class="ed-note">Whoever this page is handed to can edit around this block but cannot delete it.</span></div>'
    : '';

  // 0. Self-filling blocks say plainly where their content comes from, and
  // offer the one thing there is to decide: how many to show. There is no
  // editable body inside one — the whole point is that it cannot go stale.
  if (d.auto) {
    out += '<div class="ed-fills"><span class="ed-lab">Fills itself</span>' +
      '<p>' + esc(d.autoNote || 'This block fills itself from elsewhere in the admin.') + '</p>' +
      (d.autoCount ? '<div class="ed-step-row"><span>How many to show</span><span class="ed-step">' +
        '<button type="button" data-a="count" data-v="-1" data-k="count:-1" aria-label="Show fewer">\u2212</button>' +
        '<output>' + b.count + '</output>' +
        '<button type="button" data-a="count" data-v="1" data-k="count:1" aria-label="Show more">+</button>' +
      '</span></div>' : '') +
      '</div>';
  }

  // 0b. The info card — a slot on the banner, not a block. Off by default; the
  // banner's text column narrows to make room when it is on, so it can never
  // overlap the words and there is nothing to position by hand.
  if (d.infoCard) {
    var cardOn = b.card === 'left' || b.card === 'right';
    out += '<div class="ed-sec"><span class="ed-lab">Info card</span><div class="ed-chips">' +
      C.cardSides.map(function (s) { return chip('card', s.key, s.label, (b.card || 'off') === s.key); }).join('') +
      '</div><span class="ed-note">The white box over the banner — service times, an address, a phone number. It sits beside the text, never on top of it.</span></div>';
    if (cardOn) {
      var shows = C.cardShows.filter(function (s) { return s.key === b.cardShows; })[0] || C.cardShows[0];
      out += '<div class="ed-sec"><span class="ed-lab">Card shows</span><div class="ed-chips">' +
        C.cardShows.map(function (s) { return chip('cardShows', s.key, s.label, s.key === b.cardShows); }).join('') +
        '</div><span class="ed-note">' + esc(shows.note) + '</span></div>';
      if (b.cardShows === 'text') {
        out += '<div class="ed-sec"><label class="ed-lab" for="edCardBody">What it says</label>' +
          '<input class="ed-field" id="edCardBody" data-in="cardBody" data-k="cardBody" value="' + esc(b.cardBody) + '" placeholder="One short line"></div>';
      }
      if (b.cardShows === 'links') out += cardLinksSection(b);
      out += '<div class="ed-sec"><span class="ed-note">The gold line above the card is edited on the page itself, like any other text.</span></div>';
    }
  }

  // 0c. The def-driven controls. `choices` and `switches` are declared on the
  // block type in admin/blocks.js and read here and by sanitizeBlock from the
  // same two arrays — so a control cannot appear on this screen without being
  // guarded on the way in, and a guarded field cannot go missing from the
  // screen. That is the whole reason they are declarations rather than another
  // dozen if-branches down this function.
  (d.choices || []).forEach(function (c) {
    out += '<div class="ed-sec"><span class="ed-lab">' + esc(c.label) + '</span><div class="ed-chips">' +
      c.options.map(function (o) {
        return chip('choice', c.key + ':' + o.key, o.label, String(b[c.key]) === String(o.key));
      }).join('') +
      '</div>' + (c.note ? '<span class="ed-note">' + esc(c.note) + '</span>' : '') + '</div>';
  });
  (d.switches || []).forEach(function (sw) {
    // A real switch with its state in words beside it. A toggle on its own
    // says only that a setting exists; which way is on is a convention nobody
    // agreed to. Same rule the drawer toggles follow.
    var on = !!b[sw.key];
    out += '<div class="ed-sec" style="gap:8px">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;font-size:13.5px;color:#1E2D4A">' +
        '<span id="edSw-' + esc(sw.key) + '">' + esc(sw.label) + '</span>' +
        '<span style="display:flex;align-items:center;gap:9px">' +
          '<span class="ed-read">' + (on ? 'On' : 'Off') + '</span>' +
          '<button type="button" class="ed-track" data-a="switch" data-v="' + esc(sw.key) + '" data-k="switch:' + esc(sw.key) + '"' +
          ' role="switch" aria-labelledby="edSw-' + esc(sw.key) + '" aria-checked="' + on + '" aria-pressed="' + on + '"><span class="ed-knob"></span></button>' +
        '</span>' +
      '</div>' +
      (sw.note ? '<span class="ed-note">' + esc(sw.note) + '</span>' : '') + '</div>';
  });

  // The Standout card's display line. Edited on the page like every other text,
  // so this is a note rather than a field — but without it nobody knows the
  // 56px line is a separate thing from the heading under it.
  if (d.bigLine) {
    out += '<div class="ed-sec"><span class="ed-lab">The big line</span>' +
      '<span class="ed-note">The large number or time at the top of the card \u2014 click it on the page to change it. Keep it short: it is set at 56px, so a sentence there is not a display line.</span></div>';
  }

  // 1. Columns
  if (b.type === 'columns') {
    out += '<div class="ed-sec"><span class="ed-lab">Columns</span><div class="ed-chips">' +
      chip('cols', '2', '2 columns', b.cols === 2) + chip('cols', '3', '3 columns', b.cols === 3) +
      '</div><span class="ed-note">Columns stack on a phone automatically.</span></div>';
  }

  // 1b. Card grid — cards per row, alignment, and the colored top rule.
  // Four options or fewer is chips, not a select: a select hides three of the
  // four choices behind a click.
  if (b.type === 'cardgrid') {
    out += '<div class="ed-sec"><span class="ed-lab">Cards per row</span><div class="ed-chips">' +
      chip('cols', '2', '2', b.cols === 2) + chip('cols', '3', '3', b.cols === 3) +
      chip('cols', '4', '4', b.cols === 4) +
      '</div><span class="ed-note">Cards stack on a phone whatever you pick here.</span></div>';
    out += '<div class="ed-sec"><span class="ed-lab">Card top rule</span><div class="ed-chips">' +
      chip('topRule', '0', 'Off', !b.topRule) +
      chip('topRule', '1', 'On', !!b.topRule) +
      '</div><span class="ed-note">A colored hairline across the top of every card in this grid.</span></div>';
  }

  // 1b. Alignment — every block type except Spacer, Card grid included. Card
  // grid used to draw its own copy of these chips a few lines above, writing
  // the same `align` field; one control now, offered wherever d.align says a
  // type can use it, so there is no second place for it to fall behind.
  // Three chips rather than two: Dinger asked for right as well, looking at a
  // Button bar whose single button had no way to leave the left edge.
  if (d.align) {
    out += '<div class="ed-sec"><span class="ed-lab">Alignment</span><div class="ed-chips">' +
      chip('align', 'left', 'Left', b.align !== 'center' && b.align !== 'right') +
      chip('align', 'center', 'Center', b.align === 'center') +
      chip('align', 'right', 'Right', b.align === 'right') +
      '</div></div>';
  }

  // 1c. How the block is set apart from the page behind it. Four chips, which
  // is the "four options or fewer is chips, not a select" rule — a select would
  // hide three of the four behind a click. The note follows the choice rather
  // than listing all four, so the panel says what THIS block is doing.
  if (d.shadow) {
    var shNow = b.shadow || 'none';
    var shDef = (C.SHADOWS || []).filter(function (s) { return s.key === shNow; })[0]
      || (C.SHADOWS || [])[0] || { note: '' };
    out += '<div class="ed-sec"><span class="ed-lab">Edge</span><div class="ed-chips">' +
      (C.SHADOWS || []).map(function (s) {
        return chip('shadow', s.key, s.label, shNow === s.key);
      }).join('') +
      '</div><span class="ed-note">' + esc(shDef.note || '') + '</span></div>';
  }

  // Which fund a Give button lands on. A select rather than chips because the
  // list is however many funds the Giving screen holds, not a fixed short set.
  if (d.giveFund) {
    var funds = S.config.giveFunds || [];
    if (!funds.length) {
      out += '<div class="ed-sec"><span class="ed-lab">Fund</span>' +
        '<span class="ed-note">No funds set up yet. Add them on the Giving screen and they will appear here.</span></div>';
    } else {
      var picked = funds.filter(function (f) { return Number(f.id) === Number(b.giveFund); })[0];
      out += '<div class="ed-sec"><label class="ed-lab" for="edGiveFund">Fund</label>' +
        '<select class="ed-field" id="edGiveFund" data-in="giveFund" data-k="giveFund">' +
        '<option value=""' + (picked ? '' : ' selected') + '>Let the giving page ask</option>' +
        funds.map(function (f) {
          return '<option value="' + esc(String(f.id)) + '"' +
            (picked && Number(picked.id) === Number(f.id) ? ' selected' : '') + '>' + esc(f.name) + '</option>';
        }).join('') +
        '</select><span class="ed-note">' + esc(picked
          ? 'The button reads "Give to ' + picked.name + '" and opens Tithe.ly on that fund.'
          : 'The button hands off to give.timothystl.org, where the giver picks the fund. Choose one here for an appeal to a particular fund.') +
        '</span></div>';
    }
  }

  // Who a contact block writes to. Blank is the normal case and the note says
  // so — the point of the church-details record is that changing the address
  // once changes it everywhere, and an address typed here opts this one block
  // out of that.
  if (d.contactEmail) {
    var chEmail = S.config.churchEmail || '';
    out += '<div class="ed-sec"><label class="ed-lab" for="edCtEmail">Send email to</label>' +
      '<input class="ed-field" id="edCtEmail" type="email" data-in="contactEmail" data-k="contactEmail"' +
      ' value="' + esc(b.contactEmail || '') + '" placeholder="' + esc(chEmail || 'office@timothystl.org') + '">' +
      '<span class="ed-note">' + esc(b.contactEmail
        ? 'This block writes to the address above. It will not follow when the church email changes under Church details — clear it to go back to doing that.'
        : (chEmail
            ? 'Using the church email, ' + chEmail + '. Leave it blank unless this block should reach somebody else.'
            : 'Using the church email from Church details. Leave it blank unless this block should reach somebody else.')) +
      '</span></div>';
  }

  // 2 + 3. Photo position and column split
  if (b.type === 'textphoto') {
    out += '<div class="ed-sec"><span class="ed-lab">Photo position</span><div class="ed-chips">' +
      chip('side', 'left', 'Left', b.side === 'left') +
      chip('side', 'right', 'Right', b.side === 'right') +
      chip('side', 'above', 'Above', b.side === 'above') +
      '</div></div>';
    var sp = C.SPLITS.filter(function (x) { return x.key === b.split; })[0] || C.SPLITS[1];
    out += '<div class="ed-sec"><div class="ed-lab-row"><span class="ed-lab">Column split</span>' +
      '<span class="ed-read">' + esc(b.side === 'above' ? 'Full width' : sp.text) + '</span></div><div class="ed-chips">' +
      C.SPLITS.map(function (s) { return chip('split', s.key, s.label, s.key === b.split); }).join('') +
      '</div><span class="ed-note">Columns stack automatically on a phone.</span></div>';
  }

  // 3b. Block width (Task 13c) — on EVERY block, above Spacing.
  // Two consecutive Half blocks pair into one row. A half with no half
  // neighbor sits at half width with the right side empty; that is a
  // legitimate layout, so the note says so rather than warning about it.
  out += '<div class="ed-sec"><span class="ed-lab">Block width</span><div class="ed-chips">' +
    chip('width', 'full', 'Full', b.width !== 'half') +
    chip('width', 'half', 'Half', b.width === 'half') +
    '</div><span class="ed-note">Half blocks next to each other share two columns and fill in around a tall one. A Half on its own stays half width, and everything stacks on a phone.</span></div>';

  // 4. Spacing
  out += '<div class="ed-sec"><span class="ed-lab">Spacing</span>' +
    stepper(b, 'spaceAbove', 'Space above') +
    stepper(b, 'spaceBelow', 'Space below') +
    (b.type === 'textphoto' || b.type === 'columns' ? stepper(b, 'gap', 'Gap between columns') : '') +
    (b.type === 'spacer' ? stepper(b, 'height', 'Height') : '') +
    '<span class="ed-note">Steps of ' + C.step + 'px, capped at ' + C.max + ' — blocks always line up with the rest of the site.</span></div>';

  // 5. Photo
  if (d.photo) {
    // Same drop target as a card's picture — one gesture, wherever a photo
    // goes. It keeps its own description box below, which is the alt text the
    // page actually renders for this one (a card borrows its heading instead).
    out += '<div class="ed-sec"><span class="ed-lab">Photo</span>' +
      '<div class="ed-img" data-imgdrop="photo">' +
      '<button type="button" class="ed-media" data-a="photo" data-k="photo"><span class="ed-media-thumb"' +
        (b.photo ? ' style="background-image:url(' + esc(b.photo) + ')"' : '') + '>' + (b.photo ? '' : '▣') + '</span>' +
      '<span class="ed-media-b"><span class="ed-media-n">' + esc(b.photo ? b.photo.split('/').pop() : 'No photo yet') + '</span>' +
      '<span class="ed-media-c">Drop a photo here, or choose from the library</span></span></button></div>' +
      '<label class="ed-note" for="edAlt">Describe the photo for people using a screen reader</label>' +
      '<input class="ed-field" id="edAlt" data-in="photoAlt" data-k="alt" value="' + esc(b.photoAlt) + '" placeholder="e.g. The choir in the balcony">' +
      '</div>';
  }

  // 6. Video
  if (d.video) {
    out += '<div class="ed-sec"><span class="ed-lab">Video</span>' +
      '<button type="button" class="ed-media" data-a="video" data-k="video"><span class="ed-media-thumb ed-tile-th--vid" style="background:#1E2D4A;color:#FBF8F3">▶</span>' +
      '<span class="ed-media-b"><span class="ed-media-n">' + esc(b.video || 'No video yet') + '</span>' +
      '<span class="ed-media-c">Choose from library</span></span></button></div>';
  }

  // Link / embed target
  if (d.url) {
    // An embed URL is not a link to a page on this site, so those types get the
    // plain box they always had. Only a type whose URL is somewhere a visitor
    // is SENT gets the picker.
    var isDest = b.type === 'alert' || b.type === 'give' || b.type === 'download';
    out += '<div class="ed-sec"><label class="ed-lab" for="edUrl">' + esc(d.urlLabel || 'Link') + '</label>' +
      (isDest
        ? linkField('url', b.url, '/where-it-goes', 'edUrl')
        : '<input class="ed-field" id="edUrl" data-in="url" data-k="url" value="' + esc(b.url) + '" placeholder="https://…">') +
      '</div>';
  }

  // 6b. Where the logos come from. Reading the partner ministries is the
  // default for a new block because a logo typed into a page is one the values
  // page and the footer never get, and one nobody remembers to change when the
  // partner rebrands. The hand-typed list stays for logos that are not partner
  // ministries at all.
  if (d.partnerSource) out += partnerSourceSection(b);

  // Repeating rows. Hidden while the block is reading the record — a list of
  // typed logos nothing renders is a list somebody will edit and wonder about.
  // It is not deleted: switching back to Chosen by hand brings it back exactly
  // as it was.
  if (d.items && !(d.partnerSource && b.source === 'record')) out += itemsSection(b, d);

  // 7. Theme colors
  out += '<div class="ed-sec"><div class="ed-lab-row"><span class="ed-lab">Theme colors</span>' +
    '<span class="ed-read">' + esc(C.BG[b.bg].name) + ' · ' + esc(C.INK[b.ink].name) + '</span></div>' +
    '<span class="ed-note">Background</span><div class="ed-chips">' +
    C.BG.map(function (t, i) {
      return '<button type="button" class="ed-sw" data-a="bg" data-v="' + i + '" data-k="bg:' + i + '" title="' + esc(t.name) + '"' +
        ' aria-label="Background ' + esc(t.name) + '" aria-pressed="' + (i === b.bg) + '" style="background:' + t.c + '"></button>';
    }).join('') + '</div>' +
    '<span class="ed-note">Text</span><div class="ed-chips">' +
    C.INK.map(function (t, i) {
      var usable = t.onDark === C.BG[b.bg].dark;
      return '<button type="button" class="ed-sw" data-a="ink" data-v="' + i + '" data-k="ink:' + i + '" title="' +
        esc(t.name + (usable ? '' : ' — unreadable on ' + C.BG[b.bg].name)) + '"' +
        ' aria-label="Text color ' + esc(t.name) + (usable ? '' : ', unreadable on ' + esc(C.BG[b.bg].name)) + '"' +
        ' aria-pressed="' + (i === b.ink) + '" aria-disabled="' + (!usable) + '" style="background:' + t.c + '"></button>';
    }).join('') + '</div>' +
    '<span class="ed-note">Only the site\'s own palette, and only pairs that stay readable — unusable combinations are grayed out.</span></div>';

  // 8. Text size
  var sz = C.SIZES.filter(function (x) { return x.key === b.size; })[0] || C.SIZES[1];
  out += '<div class="ed-sec"><div class="ed-lab-row"><span class="ed-lab">Text size</span>' +
    '<span class="ed-read">' + sz.body + 'px body text</span></div><div class="ed-chips">' +
    C.SIZES.map(function (x) {
      return chip('size', x.key, x.label, x.key === b.size, ' style="font-size:' + (x.key === 's' ? 12 : x.key === 'm' ? 13.5 : 15) + 'px"');
    }).join('') +
    '</div><span class="ed-note">Three steps on the site\'s type scale — headings scale with the body text, so nothing drops below readable size.</span></div>';

  // 9. Stamp
  out += '<div class="ed-sec ed-sec--rule"><div class="ed-lab-row"><span class="ed-lab">Stamp</span>' +
    '<span class="ed-read">' + esc(b.stamp || 'None') + '</span></div><div class="ed-chips">' +
    chip('stamp', '', 'None', !b.stamp) +
    C.stamps.map(function (s) { return chip('stamp', s, s, b.stamp === s); }).join('') + '</div>';
  if (b.stamp) {
    out += '<div class="ed-chips">' + C.TONES.map(function (t, i) {
      return '<button type="button" class="ed-pick" data-a="tone" data-v="' + i + '" data-k="tone:' + i + '" aria-pressed="' + (i === b.tone) + '"' +
        ' style="background:' + t.bg + ';color:' + t.fg + ';border:1px solid ' + t.bg + ';font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:10.5px' +
        (i === b.tone ? ';box-shadow:0 0 0 2px #2E7EA6' : '') + '">' + esc(t.name) + '</button>';
    }).join('') + '</div>' +
    '<div class="ed-chips">' + chip('corner', 'tl', 'Left', b.corner === 'tl') + chip('corner', 'tr', 'Right', b.corner === 'tr') + '</div>';
  }
  out += '<span class="ed-note">Sits tilted over the block\'s lower corner. Click it on the page to reword it.</span></div>';

  // 10-12. Show on phone, reassurance, reset
  out += '<div class="ed-sec ed-sec--rule" style="gap:10px">' +
    '<div style="display:flex;align-items:center;justify-content:space-between;font-size:13.5px;color:#1E2D4A">' +
      '<span id="edPhoneLab">Show on phone</span>' +
      '<button type="button" class="ed-track" data-a="hide" data-k="hide" role="switch" aria-labelledby="edPhoneLab"' +
      ' aria-checked="' + (!b.hidden) + '" aria-pressed="' + (!b.hidden) + '"><span class="ed-knob"></span></button>' +
    '</div>' +
    '<div class="ed-reassure"><i aria-hidden="true">✓</i><span>Every value snaps to the site\'s spacing scale and fonts, so a page can\'t end up misaligned or unreadable on a phone.</span></div>' +
    '<div style="display:flex;gap:6px;flex-wrap:wrap">' +
      '<button type="button" class="ed-reset" data-a="reset" data-k="reset">Reset block</button>' +
      '<button type="button" class="ed-reset" data-a="save-section" data-k="save-section">Save as reusable section</button>' +
    '</div></div>' + lockRow;

  return out;
}

// The Partner logos block's source: the partner ministries record, or a list
// typed here. When it reads the record, the partners are ticked rather than
// retyped, and a partner with no logo says so with a link to go and add one —
// the logo lives on the partner, not on this page.
function partnerSourceSection(b) {
  var list = S.config.partners || [];
  var chosen = b.partnerIds || [];
  var out = '<div class="ed-sec"><span class="ed-lab">Logos come from</span><div class="ed-chips">' +
    chip('source', 'record', 'Partner ministries', b.source === 'record') +
    chip('source', 'manual', 'Chosen by hand', b.source !== 'record') +
    '</div><span class="ed-note">Reading the partner ministries means a logo uploaded once on the Partners screen appears everywhere it is shown, and nothing here goes stale when a partner rebrands.</span></div>';
  if (b.source !== 'record') return out;

  if (!list.length) {
    return out + '<div class="ed-sec"><span class="ed-lab">Which partners</span>' +
      '<span class="ed-note">There are no partner ministries yet. Add them under Partners in the admin and they appear here.</span></div>';
  }
  var missing = 0;
  var rows = list.map(function (p) {
    if (!p.logo) missing++;
    var on = !chosen.length || chosen.indexOf(p.id) > -1;
    return '<label class="ed-check"><input type="checkbox" data-in="partner:' + p.id + '"' + (on ? ' checked' : '') + '>' +
      esc(p.name) + (p.logo ? '' : ' <span style="color:#8C3A28">— no logo yet</span>') + '</label>';
  }).join('');
  return out + '<div class="ed-sec"><span class="ed-lab">Which partners</span>' + rows +
    '<span class="ed-note">' +
      (chosen.length
        ? 'Only the ticked ones are shown. A partner added later will not appear until it is ticked here.'
        : 'All of them, including any added later. Untick one to choose a set instead.') +
      (missing ? ' ' + missing + (missing === 1 ? ' partner has' : ' partners have') + ' no logo uploaded, so ' + (missing === 1 ? 'it shows' : 'they show') + ' as a name — upload one on the Partners screen.' : '') +
    '</span></div>';
}

// The rows inside a block — a grid's cards, a bar's buttons, a gallery's photos.
// Ten block types carry one of these lists.
//
// ⚠ THEY COULD NOT BE REORDERED AT ALL until this was written. The only two
// actions were add and remove, so moving the seventh card in a grid to the top
// meant deleting and retyping all seven. On the Ministries page that is nine
// cards — and that grid's "featured" card is simply the FIRST one, so which
// ministry the page leads with was decided by insertion order and could not be
// changed afterwards at all.
//
// Both a grip and a pair of arrows, deliberately. The grip is the idiom the
// rest of this admin already uses (panelList, the menu tree, the block rail);
// the arrows are what keep it reachable without a mouse, since drag on its own
// is a keyboard dead end — the same finding the accessibility pass made about
// list rows. They are also simply better in a 322px panel that may hold
// twenty-four rows.
function moveRow(kind, i, n, label) {
  var btn = function (dir, glyph, off) {
    return '<button type="button" class="ed-move" data-a="' + kind + '-' + dir + '" data-v="' + i +
      '" data-k="' + kind + '-' + dir + ':' + i + '"' + (off ? ' disabled' : '') +
      ' aria-label="Move ' + esc(label) + ' ' + (i + 1) + ' ' + dir + '" title="Move ' + dir + '">' + glyph + '</button>';
  };
  return btn('up', '↑', i === 0) + btn('down', '↓', i === n - 1);
}

// ── THE LINK FIELD ─────────────────────────────────────────────────────────
// A text box was all there was, and safeUrl() only ever decided whether a value
// was SAFE — it has no opinion about whether the address exists. So /abuot
// saved cleanly, rendered as an ordinary link, and sent the visitor to the
// page-not-found screen. That is the repo's own rule broken by omission: a dead
// link is worse than a missing one, because it looks like it works.
//
// ⚠ ONLY `url`, AND ONLY WHEN THE LIST IS NOT PHOTOS. A gallery's and a
// slideshow's `url` is an IMAGE address, and offering "pick a page" for a
// photograph would be nonsense; a card grid's `img` and a partner's `meta` are
// images too. One rule, so a new type with a link field gets this for free and
// a new type with an image field does not get it by accident.
function isLinkField(d, field) {
  return field === 'url' && !d.gallery;
}

// The other half of the same rule. A picture field is declared on the type
// (`itemImageFields` in admin/blocks.js), plus a gallery's own `url`, which is
// an image address by construction. The two predicates are deliberately
// exclusive: a field is somewhere a visitor is SENT, or it is something an
// <img> points at, and the control it gets is not the same either way.
function isImageField(d, field) {
  if (d.gallery) return field === 'url';
  return (d.itemImageFields || []).indexOf(field) > -1;
}

// A picture field: the thumbnail you can see, a place to drop a photograph off
// the desktop, the library behind the same button, and the address box that was
// always here. The box stays because not every picture on the site is one of
// ours — a partner's logo is often hosted by the partner — and removing the one
// way to type an address would be a capability lost to make a gesture prettier.
function imageField(spec, value, placeholder, label) {
  var name = value ? String(value).split('/').pop() : '';
  return '<div class="ed-img" data-imgdrop="' + esc(spec) + '">' +
    '<button type="button" class="ed-media" data-a="pickimg" data-v="' + esc(spec) + '" data-k="pickimg:' + esc(spec) + '">' +
      '<span class="ed-media-thumb"' + (value ? ' style="background-image:url(' + esc(value) + ')"' : '') + '>' +
        (value ? '' : '▣') + '</span>' +
      '<span class="ed-media-b"><span class="ed-media-n">' + esc(name || 'No picture yet') + '</span>' +
      '<span class="ed-media-c">Drop a photo here, or choose from the library</span></span></button>' +
    '<input class="ed-field" data-in="' + esc(spec) + '" data-k="' + esc(spec) + '"' +
      ' value="' + esc(value || '') + '" placeholder="' + esc(placeholder) + '" aria-label="' + esc(label) + '">' +
    '</div>';
}

function linkPicker(spec) {
  var groups = tlcPickerGroups(S.linkTargets || []);
  if (!groups.length) return '';
  var opts = groups.map(function (g) {
    return '<optgroup label="' + esc(g.name) + '">' + g.items.map(function (i) {
      return '<option value="' + esc(i.url) + '">' + esc(i.label) + ' — ' + esc(i.url) + '</option>';
    }).join('') + '</optgroup>';
  }).join('');
  return '<select class="ed-linkpick" data-target="' + esc(spec) + '" aria-label="Pick a page on this site">' +
    '<option value="">Pick a page on this site…</option>' + opts + '</select>';
}

// The whole control: the box, the picker, and the sentence.
function linkField(spec, value, placeholder, id) {
  return '<div class="ed-link">' +
    '<input class="ed-field"' + (id ? ' id="' + id + '"' : '') + ' data-in="' + esc(spec) + '"' +
      ' data-link="1" data-k="' + esc(spec) + '" value="' + esc(value || '') + '"' +
      ' placeholder="' + esc(placeholder) + '">' +
    linkPicker(spec) +
    '<span class="ed-linkwarn" data-warn="' + esc(spec) + '">' + esc(tlcLinkWarning(value || '', S.linkTargets || [])) + '</span>' +
    '</div>';
}

// Repaints one field's sentence without re-rendering the inspector — which
// would steal focus out of the box somebody is still typing into.
function paintLinkWarning(input) {
  var spec = input.dataset.in;
  var slot = el.edInspBody.querySelector('.ed-linkwarn[data-warn="' + spec.replace(/"/g, '') + '"]');
  if (!slot) return;
  slot.textContent = tlcLinkWarning(input.value, S.linkTargets || []);
}

function itemsSection(b, d) {
  var inputFields = d.itemUrlFields.slice();
  if (d.gallery) inputFields = ['url'];
  var list = b.items || [];
  var rows = list.map(function (it, i) {
    var fields = inputFields.map(function (f) {
      var ph = d.itemPlaceholders[f] || (f === 'url' ? 'https://…' : f);
      if (isLinkField(d, f)) return linkField('item:' + i + ':' + f, it[f], ph);
      if (isImageField(d, f)) {
        return imageField('item:' + i + ':' + f, it[f], ph, d.itemLabel + ' ' + (i + 1) + ' picture');
      }
      return '<input class="ed-field" data-in="item:' + i + ':' + f + '" data-k="item:' + i + ':' + f + '"' +
        ' value="' + esc(it[f] || '') + '" placeholder="' + esc(ph) + '" aria-label="' + esc(d.itemLabel + ' ' + (i + 1) + ' ' + f) + '">';
    }).join('');
    // ⚠ The GRIP carries draggable, never the row. The row contains text
    // inputs, and a draggable ancestor stops the mouse selecting text inside
    // them — you would drag the whole card instead of highlighting a word.
    var grip = list.length > 1
      ? '<span class="ed-grip" draggable="true" aria-hidden="true" title="Drag to reorder">⠿</span>' : '';
    var head = '<div class="ed-item-h">' + grip + '<span class="ed-item-n">' + esc(d.itemLabel + ' ' + (i + 1)) +
      (it.title ? ' · ' + esc(String(it.title).slice(0, 22)) : '') + '</span>' +
      (list.length > 1 ? moveRow('item', i, list.length, d.itemLabel) : '') +
      '<button type="button" data-a="item-del" data-v="' + i + '" data-k="item-del:' + i + '">Remove</button></div>';
    var hint = fields ? '' : '<span class="ed-note">Edit the wording on the page itself.</span>';
    return '<div class="ed-item" data-row="' + i + '">' + head + fields + hint + '</div>';
  }).join('');
  var full = (b.items || []).length >= 24;
  return '<div class="ed-sec"><span class="ed-lab">' + esc(d.itemLabel) + 's</span>' +
    '<div class="ed-rows" data-rows="item">' + rows + '</div>' +
    (d.gallery
      ? '<button type="button" class="ed-add" data-a="gallery" data-k="gallery">Add photos from the library</button>'
      : '<button type="button" class="ed-add" data-a="item-add" data-k="item-add"' + (full ? ' disabled' : '') + '>+ Add ' + esc(d.itemLabel.toLowerCase()) + '</button>') +
    '</div>';
}

// The card's own links. Kept apart from the block's `items` and `links` — a
// welcome banner already uses `links` for its buttons, and one array doing two
// jobs is how a button ends up inside the card.
function cardLinksSection(b) {
  var rows = (b.cardLinks || []).map(function (l, i) {
    var n = (b.cardLinks || []).length;
    return '<div class="ed-item" data-row="' + i + '"><div class="ed-item-h">' +
      (n > 1 ? '<span class="ed-grip" draggable="true" aria-hidden="true" title="Drag to reorder">⠿</span>' : '') +
      '<span class="ed-item-n">Link ' + (i + 1) + '</span>' +
      (n > 1 ? moveRow('cardlink', i, n, 'Link') : '') +
      '<button type="button" data-a="cardlink-del" data-v="' + i + '" data-k="cardlink-del:' + i + '">Remove</button></div>' +
      '<input class="ed-field" data-in="cardlink:' + i + ':title" data-k="cardlink:' + i + ':title" value="' + esc(l.title || '') + '" placeholder="What it says" aria-label="Link ' + (i + 1) + ' label">' +
      linkField('cardlink:' + i + ':url', l.url, '/visit') +
      '</div>';
  }).join('');
  var full = (b.cardLinks || []).length >= 4;
  return '<div class="ed-sec"><span class="ed-lab">Links</span>' +
    '<div class="ed-rows" data-rows="cardlink">' + rows + '</div>' +
    '<button type="button" class="ed-add" data-a="cardlink-add" data-k="cardlink-add"' + (full ? ' disabled' : '') + '>+ Add link</button>' +
    '<span class="ed-note">Four at most — the card is a signpost, not a menu.</span></div>';
}

// ── inspector actions ──────────────────────────────────────────────────────
function inspectorAction(action, value) {
  var b = findBlock(S.selectedId);
  if (!b) return;
  var C = S.config;
  var d = def(b.type);
  switch (action) {
    case 'cols': {
      var n = Number(value);
      // Growing to three columns needs a third column to put text in.
      var items = (b.items || []).slice();
      var structural = false;
      while (items.length < n) { items.push({ title: '', body: '' }); structural = true; }
      patch(b.id, structural ? { cols: n, items: items } : { cols: n }, 'Changed to ' + n + ' columns', structural ? 'rerender' : 'style');
      break;
    }
    case 'width': {
      // Structural: whether this block pairs with its neighbor changes the
      // markup around both, so the Worker re-renders rather than the editor
      // patching a custom property.
      patch(b.id, { width: value === 'half' ? 'half' : 'full' },
        value === 'half' ? 'Half width' : 'Full width', 'rerender');
      break;
    }
    case 'align': {
      var al = value === 'center' || value === 'right' ? value : 'left';
      patch(b.id, { align: al },
        al === 'center' ? 'Centered' : al === 'right' ? 'Right-aligned' : 'Left-aligned', 'rerender');
      break;
    }
    case 'shadow': {
      var sh = (C.SHADOWS || []).filter(function (s) { return s.key === value; })[0];
      if (!sh) return;
      // Structural: the class lives on the wrapper the SERVER writes, so a
      // style-mode patch would set a custom property nothing reads — the same
      // ruling the width chip carries.
      patch(b.id, { shadow: sh.key }, 'Edge → ' + sh.label, 'rerender');
      break;
    }
    // Both are structural: they change what the renderer emits, not just a
    // custom property on the node, so the Worker re-renders rather than the
    // editor patching a variable that nothing reads.
    case 'choice': {
      var ci = value.indexOf(':');
      var ckey = value.slice(0, ci);
      var cval = value.slice(ci + 1);
      var cdef = (d.choices || []).filter(function (x) { return x.key === ckey; })[0];
      if (!cdef) return;
      var copt = cdef.options.filter(function (o) { return String(o.key) === cval; })[0];
      if (!copt) return;
      var cp = {}; cp[ckey] = copt.key;
      patch(b.id, cp, cdef.label + ' \u2192 ' + copt.label, 'rerender');
      break;
    }
    case 'switch': {
      var sdef = (d.switches || []).filter(function (x) { return x.key === value; })[0];
      if (!sdef) return;
      var sp = {}; sp[value] = !b[value];
      patch(b.id, sp, sdef.label + (b[value] ? ' off' : ' on'), 'rerender');
      break;
    }
    case 'topRule': {
      patch(b.id, { topRule: value === '1' }, value === '1' ? 'Top rule on' : 'Top rule off', 'rerender');
      break;
    }
    case 'count': {
      var n2 = Math.max(1, Math.min(6, (b.count || 3) + Number(value)));
      if (n2 === b.count) return;
      patch(b.id, { count: n2 }, 'Showing ' + n2 + ' at a time', 'rerender');
      say('Showing ' + n2);
      break;
    }
    case 'side': patch(b.id, { side: value }, 'Moved photo ' + value); break;
    case 'split': patch(b.id, { split: value }, 'Changed column split'); break;
    case 'step': {
      var parts = value.split(':');
      var key = parts[0];
      var delta = Number(parts[1]) * C.step;
      var v = Math.max(0, Math.min(C.max, (b[key] || 0) + delta));
      if (v === b[key]) return;
      var p = {}; p[key] = v;
      // Spacing steps deliberately write no change-log entry — nudging a
      // stepper four times would otherwise bury the meaningful edits.
      // ⚠ A HALF block's spacing lives on the .tlcb-pair wrapper the SERVER
      // writes, not on the block's own node — a style-mode patch updates a
      // custom property the pair never reads, so the stepper moved nothing
      // and the published page diverged from what the editor showed. Same
      // ruling as the width chip above: anything the pair wrapper renders is
      // the Worker's render.
      patch(b.id, p, null, b.width === 'half' ? 'rerender' : 'style');
      say(key === 'height' ? 'Height ' + v + 'px' : v + 'px');
      break;
    }
    case 'bg': {
      var bgIdx = Number(value);
      var part = { bg: bgIdx };
      // Guardrail as data, not an ad-hoc conditional: an ink that would be
      // unreadable on the new background moves to the readable default.
      if (C.INK[b.ink].onDark !== C.BG[bgIdx].dark) part.ink = C.BG[bgIdx].dark ? 3 : 0;
      patch(b.id, part, 'Background ' + C.BG[bgIdx].name);
      break;
    }
    case 'ink': {
      var inkIdx = Number(value);
      if (C.INK[inkIdx].onDark !== C.BG[b.bg].dark) {
        say(C.INK[inkIdx].name + ' would be unreadable on ' + C.BG[b.bg].name);
        return;
      }
      patch(b.id, { ink: inkIdx }, 'Text color ' + C.INK[inkIdx].name);
      break;
    }
    case 'size': patch(b.id, { size: value }, 'Text size ' + value.toUpperCase()); break;
    // 'Stamp → Upcoming' is an arrow BETWEEN two words — a sentence about a
    // state change, which the arrow rule allows in as many words. The v4.12.0
    // sweep took it anyway and the change log read 'Stamp Upcoming'.
    case 'stamp': patch(b.id, { stamp: value }, value ? 'Stamp → ' + value : 'Removed stamp', 'rerender'); break;
    case 'tone': patch(b.id, { tone: Number(value) }, 'Stamp color ' + C.TONES[Number(value)].name, 'rerender'); break;
    case 'corner': patch(b.id, { corner: value }, 'Stamp moved ' + (value === 'tl' ? 'left' : 'right'), 'rerender'); break;
    case 'hide': toggleHide(b.id); break;
    case 'reset': resetBlock(b.id); break;
    case 'save-section': saveSection([b], d.label); break;
    case 'item-add': {
      var next = (b.items || []).slice();
      if (next.length >= 24) return;
      var blank = {};
      d.itemFields.forEach(function (f) { blank[f] = ''; });
      next.push(blank);
      patch(b.id, { items: next }, 'Added a ' + d.itemLabel.toLowerCase(), 'rerender');
      break;
    }
    // Reordering a block's own rows. One helper for both lists, so the card
    // links cannot come to behave differently from the cards.
    case 'item-up': case 'item-down': case 'cardlink-up': case 'cardlink-down': {
      var isCard = action.indexOf('cardlink') === 0;
      var key = isCard ? 'cardLinks' : 'items';
      var from = Number(value);
      var to = from + (action.slice(-2) === 'up' ? -1 : 1);
      var arr = (b[key] || []).slice();
      if (to < 0 || to >= arr.length) return;
      arr.splice(to, 0, arr.splice(from, 1)[0]);
      var pp = {}; pp[key] = arr;
      // Structural: the renderer emits the rows in array order, so the Worker
      // re-renders rather than the editor patching a custom property.
      patch(b.id, pp, 'Moved a ' + (isCard ? 'link' : d.itemLabel.toLowerCase()) + ' ' + action.slice(-2), 'rerender');
      say('Moved to position ' + (to + 1));
      break;
    }
    case 'item-del': {
      var idx = Number(value);
      var left = (b.items || []).filter(function (_, i) { return i !== idx; });
      patch(b.id, { items: left }, 'Removed a ' + d.itemLabel.toLowerCase(), 'rerender');
      break;
    }
    // Switching the card on or off changes the banner from one column to two,
    // and switching what it shows changes what is in it — both are structure,
    // so both re-render rather than being patched onto the node.
    case 'card': {
      if ((b.card || 'off') === value) return;
      patch(b.id, { card: value }, value === 'off' ? 'Info card switched off' : 'Info card moved ' + value, 'rerender');
      say(value === 'off' ? 'Card off' : 'Card on the ' + value);
      break;
    }
    // Structural: which logos exist is decided server-side from the record, so
    // the Worker re-renders rather than the editor patching a style variable.
    case 'source': {
      if ((b.source || 'manual') === value) return;
      patch(b.id, { source: value }, value === 'record' ? 'Reads the partner ministries' : 'Logos chosen by hand', 'rerender');
      say(value === 'record' ? 'Reading the partner ministries' : 'Logos chosen by hand');
      break;
    }
    case 'cardShows': {
      if (b.cardShows === value) return;
      var shows = C.cardShows.filter(function (s) { return s.key === value; })[0];
      patch(b.id, { cardShows: value }, 'Card now shows ' + (shows ? shows.label.toLowerCase() : value), 'rerender');
      break;
    }
    case 'cardlink-add': {
      var links = (b.cardLinks || []).slice();
      if (links.length >= 4) return;
      links.push({ title: '', url: '' });
      patch(b.id, { cardLinks: links }, 'Added a card link', 'rerender');
      break;
    }
    case 'cardlink-del': {
      var li = Number(value);
      patch(b.id, { cardLinks: (b.cardLinks || []).filter(function (_, i) { return i !== li; }) }, 'Removed a card link', 'rerender');
      break;
    }
    case 'photo': openPicker(b.id, 'photo'); break;
    case 'pickimg': openPicker(b.id, 'photo', value); break;
    case 'video': openPicker(b.id, 'video'); break;
    case 'gallery': openPicker(b.id, 'gallery'); break;
    default: break;
  }
}

// Text inputs update state as you type without redrawing the panel underneath
// the caret; the canvas catches up on a short debounce.
var inputTimer = null;
function inspectorInput(target) {
  var b = findBlock(S.selectedId);
  if (!b) return;
  var spec = target.dataset.in;
  var value = target.value;
  if (spec === 'locked') {
    // A structural fact about the block, not a typed value — save it now
    // rather than on the 700ms input debounce below.
    patch(b.id, { locked: target.checked }, target.checked ? 'Marked as set by the office' : 'Unmarked as set by the office', 'none');
    renderRail();
    return;
  }
  if (spec.indexOf('partner:') === 0) {
    // ⚠ Empty means ALL, so unticking one of an untouched block has to write
    // out every OTHER partner rather than an empty list — otherwise unticking
    // one would read as "show them all" and the tick would appear to do
    // nothing. Ticking the last missing one collapses back to empty, so a
    // partner added later is picked up again without anybody editing the page.
    var pid = Number(spec.slice('partner:'.length));
    var all = (S.config.partners || []).map(function (p) { return p.id; });
    var now = (b.partnerIds && b.partnerIds.length) ? b.partnerIds.slice() : all.slice();
    if (target.checked) { if (now.indexOf(pid) === -1) now.push(pid); }
    else now = now.filter(function (n) { return n !== pid; });
    var next = now.length === all.length ? [] : all.filter(function (n) { return now.indexOf(n) > -1; });
    patch(b.id, { partnerIds: next }, 'Changed which partners are shown', 'rerender');
    return;
  }
  if (spec === 'giveFund') {
    // Structural: the button's label and its address are both built from this
    // at render time, so the Worker redraws rather than the editor patching a
    // custom property nothing reads.
    patch(b.id, { giveFund: Number(value) || 0 }, 'Changed the fund', 'rerender');
    return;
  }
  if (spec === 'url') b.url = value;
  else if (spec === 'contactEmail') b.contactEmail = value;
  else if (spec === 'photoAlt') b.photoAlt = value;
  else if (spec === 'cardBody') b.cardBody = value;
  else if (spec.indexOf('cardlink:') === 0) {
    var cp = spec.split(':');
    var cl = (b.cardLinks || [])[Number(cp[1])];
    if (!cl) return;
    cl[cp[2]] = value;
  }
  else if (spec.indexOf('item:') === 0) {
    var parts = spec.split(':');
    var it = (b.items || [])[Number(parts[1])];
    if (!it) return;
    it[parts[2]] = value;
  } else return;
  clearTimeout(inputTimer);
  inputTimer = setTimeout(function () {
    pushHistory();
    note('Edited ' + def(b.type).label.toLowerCase());
    rerender();
    renderTop(); renderChanges(); scheduleSave();
  }, 700);
}

// ── static wiring ──────────────────────────────────────────────────────────
function bindStatic() {
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-device]');
    if (t) { setDevice(t.dataset.device); return; }
    if (e.target.closest('#edHintX')) { S.hint = false; el.edHint.style.display = 'none'; try { localStorage.setItem(HINT_KEY, '1'); } catch (_) {} return; }
    var tab = e.target.closest('[data-group]');
    if (tab) { S.group = tab.dataset.group; S.paletteOpen = true; renderPalette(); return; }
    if (e.target.closest('#edPalToggle')) { S.paletteOpen = !S.paletteOpen; renderPalette(); return; }
    if (e.target.closest('#edUndo')) { undo(); return; }
    if (e.target.closest('#edRedo')) { redo(); return; }
  });

  // rail
  el.edRail.addEventListener('click', function (e) {
    var row = e.target.closest('.ed-row');
    if (!row) return;
    select(row.dataset.id);
    // ⚠ On a phone the outline and the page are different surfaces, so picking
    // a block in a list and being left looking at the list reads as nothing
    // having happened. On a desktop the canvas is already beside you and this
    // does nothing at all.
    if (isNarrow()) setMobileView('canvas');
  });

  // ── THE TWO LEFT RAILS ───────────────────────────────────────
  // Both fold away to a 26px spine so the page being edited gets the width.
  // One function drives both, and the choice is remembered — somebody working
  // on a laptop collapses them once, not on every page they open.
  //
  // This sits OUTSIDE the pages-rail guard below on purpose: the block outline
  // exists on ministry pages too, where there is no page list at all.
  function setRail(which, open) {
    var isPages = which === 'pages';
    var aside = isPages ? el.edPages : el.edBlockRail;
    var btn = isPages ? el.edPagesToggle : el.edRailToggle;
    if (!aside || !btn) return;
    if (isPages) S.railOpen = open; else S.blocksOpen = open;
    aside.classList.toggle(isPages ? 'ed-pages--shut' : 'ed-rail--shut', !open);
    btn.textContent = open ? '\u2039' : '\u203A';
    btn.setAttribute('aria-expanded', String(open));
    btn.setAttribute('aria-label', (open ? 'Hide the ' : 'Show the ') + (isPages ? 'page list' : 'block list'));
    try { localStorage.setItem('tlcEdRail' + which, open ? '1' : '0'); } catch (_) {}
    fitPaper();
  }

  if (el.edRailToggle) {
    el.edRailToggle.addEventListener('click', function () { setRail('blocks', !S.blocksOpen); });
  }

  // Restore what they chose last time. Missing means open, so a first visit
  // shows everything rather than a page flanked by two mystery spines.
  try {
    if (localStorage.getItem('tlcEdRailpages') === '0') setRail('pages', false);
    if (localStorage.getItem('tlcEdRailblocks') === '0') setRail('blocks', false);
  } catch (_) {}

  // pages rail
  if (el.edPagesList) {
    el.edPagesList.addEventListener('click', function (e) {
      var btn = e.target.closest('[data-page]');
      if (!btn || btn.dataset.page === S.slug) return;
      // Leaving with work in flight would lose it, so flush first.
      goToPage(btn.dataset.page);
    });
    el.edPagesSearch.addEventListener('input', renderPagesRail);
    el.edPagesToggle.addEventListener('click', function () {
      setRail('pages', !S.railOpen);
    });
    el.edPagesNew.addEventListener('click', async function () {
      await flushDraft();
      var form = document.createElement('form');
      form.method = 'POST';
      form.action = '/pages/new';
      document.body.appendChild(form);
      form.submit();
    });
  }

  // canvas: selection, block toolbar, media pickers
  el.edPaper.addEventListener('click', function (e) {
    var actEl = e.target.closest('[data-act]');
    var wrap = e.target.closest('.tlcb');
    if (!wrap) return;
    if (actEl) {
      e.preventDefault();
      e.stopPropagation();
      var id = wrap.dataset.id;
      var act = actEl.dataset.act;
      if (act === 'dup') return duplicateBlock(id);
      if (act === 'del') return deleteBlock(id);
      if (act === 'hide') return toggleHide(id);
      if (act === 'up') return moveBlock(id, -1);
      if (act === 'down') return moveBlock(id, 1);
      if (act === 'photo' || act === 'video' || act === 'gallery') { select(id); return openPicker(id, act); }
      return;
    }
    if (e.target.closest('[contenteditable="true"]')) { select(wrap.dataset.id); return; }
    select(wrap.dataset.id);
  });

  // A rich field becomes a TinyMCE editor the moment somebody puts the caret in
  // it, and not before — see openRichField for what that is protecting.
  el.edPaper.addEventListener('focusin', function (e) {
    var node = e.target.closest ? e.target.closest('[data-rich="1"]') : null;
    if (node) openRichField(node);
  }, true);

  // commit text on blur
  el.edPaper.addEventListener('focusout', function (e) {
    var node = e.target.closest ? e.target.closest('[contenteditable="true"]') : null;
    if (node) commitField(node);
  }, true);

  // Enter should not create block-level markup in single-line fields
  el.edPaper.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    var node = e.target.closest ? e.target.closest('[contenteditable="true"]') : null;
    if (!node || !node.dataset.field) return;
    var wrap = node.closest('.tlcb');
    var b = wrap && findBlock(wrap.dataset.id);
    var d = b && def(b.type);
    var rich = d && ((d.richBody && node.dataset.field === 'body' && node.dataset.item == null) ||
      (node.dataset.item != null && d.richItemFields.indexOf(node.dataset.field) > -1));
    if (!rich) { e.preventDefault(); node.blur(); }
  });

  // inspector
  el.edInspBody.addEventListener('click', function (e) {
    if (S.tab === 'page') return pageTabClick(e);
    var btn = e.target.closest('[data-a]');
    if (btn) inspectorAction(btn.dataset.a, btn.dataset.v || '');
  });
  // Choosing a page fills the box beside it and commits through the same path
  // typing does — so there is one way a link is saved, not two.
  el.edInspBody.addEventListener('change', function (e) {
    var pick = e.target.closest ? e.target.closest('.ed-linkpick') : null;
    if (!pick || !pick.value) return;
    var input = el.edInspBody.querySelector('input[data-in="' + pick.dataset.target.replace(/"/g, '') + '"]');
    if (!input) return;
    input.value = pick.value;
    inspectorInput(input);
    paintLinkWarning(input);
    // Back to the prompt: the select says what to DO, not what was chosen —
    // the box beside it is where the answer lives, and a select still reading
    // "About" beside a box reading /contact is two controls disagreeing.
    pick.value = '';
    say('Linked to ' + input.value);
  });
  el.edInspBody.addEventListener('input', function (e) {
    if (S.tab === 'page') return pageTabInput(e);
    if (e.target.dataset && e.target.dataset.in) {
      inspectorInput(e.target);
      // Repainted here rather than by re-rendering the inspector, which would
      // take the focus out of the box mid-word.
      if (e.target.dataset.link) paintLinkWarning(e.target);
    }
  });
  el.edInspBody.addEventListener('change', function (e) {
    if (S.tab === 'page') return pageTabInput(e);
    // Checkboxes fire `change`, not `input`, in every browser that matters.
    if (e.target.dataset && e.target.dataset.in) inspectorInput(e.target);
  });

  el.edInspBody.addEventListener('click', function (e) {
    if (!e.target.closest || !e.target.closest('#edUseRedesign')) return;
    if (!confirm('Replace the blocks on this page with the redesigned layout?\n\n'
      + 'What is on the page now is saved to the version history first, and the live page does not change until you press Publish.')) return;
    useRedesign();
  });

  if (el.edTabBlock) {
    el.edTabBlock.addEventListener('click', function () { S.tab = 'block'; renderInspector(); });
    el.edTabPage.addEventListener('click', function () { S.tab = 'page'; renderInspector(); });
  }

  // Pasting from Word or a website brings its own fonts, sizes and colors with
  // it. Without this the palette guarantee is worthless — one paste and the
  // page carries markup nothing in the editor can reach. Plain text only.
  el.edPaper.addEventListener('paste', function (e) {
    var field = e.target.closest && e.target.closest('[contenteditable="true"]');
    if (!field || !e.clipboardData) return;
    e.preventDefault();
    var text = e.clipboardData.getData('text/plain') || '';
    if (!text) return;
    // Single-line fields take the text as one line; a heading is not a place
    // for three paragraphs.
    if (!field.classList.contains('tlcb-prose')) text = text.replace(/\s*[\r\n]+\s*/g, ' ');
    document.execCommand('insertText', false, text);
  });

  document.addEventListener('keydown', function (e) {
    // Escape clears the selection so the whole page is visible again
    if (e.key === 'Escape' && !S.picker && S.selectedId) { select(null); return; }
    // Undo and redo. Typing inside a field is the browser's own undo, not the
    // editor's, so leave that alone — taking it over would be worse than not
    // having it. Both are checked against the same guard for that reason.
    if ((e.metaKey || e.ctrlKey) && (e.key === 'z' || e.key === 'Z')) {
      var t = e.target;
      if (t && t.closest && (t.closest('[contenteditable="true"]') || t.closest('input, textarea, select'))) return;
      // Shift is what tells them apart, which is why the undo branch has always
      // tested for its absence rather than ignoring it.
      if (e.shiftKey) {
        if (!S.future.length) return;
        e.preventDefault();
        redo();
        return;
      }
      if (!S.history.length) return;
      e.preventDefault();
      undo();
    }
  });

  // Don't lose an edit to a closed tab
  window.addEventListener('beforeunload', function (e) {
    if (!S.dirty) return;
    try {
      navigator.sendBeacon(API + '/page/' + encodeURIComponent(S.slug) + '/draft',
        new Blob([JSON.stringify({ blocks: S.blocks, changes: S.changes })], { type: 'application/json' }));
    } catch (_) {}
    // Only warn when the visitor is leaving the editor altogether. Moving to
    // another page in the rail already flushed the draft, and a "leave site?"
    // dialog there would both be untrue and cancel the navigation.
    if (S.leaving) return;
    e.preventDefault();
    e.returnValue = '';
  });

  bindDragAndDrop();
  bindPicker();
  bindPublish();

  window.addEventListener('resize', fitPaper);
  if (window.ResizeObserver) new ResizeObserver(fitPaper).observe(el.edCanvas);

  // ── THE PHONE'S BOTTOM BAR ───────────────────────────────────
  if (el.edMTabs) {
    el.edMTabs.addEventListener('click', function (e) {
      var b = e.target.closest('[data-m]');
      if (b) setMobileView(b.dataset.m);
    });
  }
  // A rotate changes which layout applies, and the paper's width with it. The
  // view itself is deliberately NOT reset — somebody who turned the phone to
  // read the page should still be on the page.
  window.addEventListener('orientationchange', fitPaper);
}

// ── reordering and adding ──────────────────────────────────────────────────
// Drop indicators are inserted into the DOM directly rather than by re-rendering
// the rail or canvas: a re-render mid-drag replaces the element being dragged,
// which cancels the drag in every browser.
function dropLabel() {
  if (S.dragSection) {
    var sec = S.sections.filter(function (x) { return x.id === Number(S.dragSection); })[0];
    return 'Insert ' + (sec ? sec.name.toLowerCase() : 'saved section') + ' here';
  }
  return S.dragType ? 'Insert ' + def(S.dragType).label.toLowerCase() + ' here' : 'Move here';
}

function clearIndicators() {
  var old = document.querySelectorAll('.ed-drop, .ed-canvas-drop');
  for (var i = 0; i < old.length; i++) old[i].remove();
}

function setDropIndex(i) {
  if (S.dropIndex === i) return; // only on change, or we thrash on every mousemove
  S.dropIndex = i;
  clearIndicators();
  if (i == null) return;
  var rows = el.edRail.querySelectorAll('.ed-row');
  var bar = document.createElement('div');
  bar.className = 'ed-drop';
  if (i >= rows.length) el.edRail.appendChild(bar); else el.edRail.insertBefore(bar, rows[i]);
  var page = el.edPaper.querySelector('.tlcb-page');
  if (!page) return;
  var blocks = page.querySelectorAll('.tlcb');
  var line = document.createElement('div');
  line.className = 'ed-canvas-drop';
  line.innerHTML = '<span>' + esc(dropLabel()) + '</span>';
  if (i >= blocks.length) { page.appendChild(line); return; }
  // A half block sits INSIDE a .tlcb-pair wrapper, so blocks[i] can be a
  // grandchild of the page — insertBefore(page, grandchild) throws
  // NotFoundError and the whole drag dies. Walk up to the page's own child;
  // the indicator lands at the pair boundary, which is honest, because the
  // server re-pairs on drop and mid-pair positions do not exist until then.
  var ref = blocks[i];
  while (ref && ref.parentNode !== page) ref = ref.parentNode;
  if (ref) page.insertBefore(line, ref); else page.appendChild(line);
}

function clearDrag() {
  S.dragId = null;
  S.dragType = null;
  S.dragSection = null;
  S.dropIndex = null;
  clearIndicators();
  var dragging = el.edRail.querySelectorAll('.is-dragging');
  for (var i = 0; i < dragging.length; i++) dragging[i].classList.remove('is-dragging');
}

// Midpoint rule: above the halfway line drops before this block, below it after.
// `node` is passed explicitly — these listeners are delegated from the rail and
// canvas containers, so e.currentTarget is the container and measuring against
// it would put every drop in the same place.
function overItem(e, index, node) {
  if (!S.dragId && !S.dragType && !S.dragSection) return;
  e.preventDefault();
  e.stopPropagation();
  var r = node.getBoundingClientRect();
  setDropIndex((e.clientY - r.top) < r.height / 2 ? index : index + 1);
}

function overContainer(e) {
  if (!S.dragId && !S.dragType && !S.dragSection) return;
  e.preventDefault();
  if (S.dropIndex === null) setDropIndex(S.blocks.length);
}

async function performDrop(e) {
  if (e) e.preventDefault();
  if (!S.dragId && !S.dragType && !S.dragSection) return;
  var at = S.dropIndex == null ? S.blocks.length : S.dropIndex;
  var type = S.dragType;
  var id = S.dragId;
  var section = S.dragSection;
  clearDrag();
  if (section) {
    return insertSection(section, at);
  }
  if (type) {
    var block = await freshBlock(type);
    pushHistory();
    S.blocks.splice(at, 0, block);
    S.selectedId = block.id;
    note('Added ' + def(type).label.toLowerCase());
    say(def(type).label + ' added at position ' + (at + 1));
  } else if (id) {
    var from = indexOfBlock(id);
    if (from < 0) return;
    // Removing the source first shifts everything after it down by one.
    if (at > from) at -= 1;
    if (at === from) return;
    pushHistory();
    var moved = S.blocks.splice(from, 1)[0];
    S.blocks.splice(at, 0, moved);
    note('Reordered ' + def(moved.type).label.toLowerCase());
    say(def(moved.type).label + ' moved to position ' + (at + 1) + ' of ' + S.blocks.length);
  }
  await rerender();
  renderTop(); renderRail(); renderChanges(); scheduleSave();
}

async function moveBlock(id, delta) {
  var from = indexOfBlock(id);
  var to = from + delta;
  if (from < 0 || to < 0 || to >= S.blocks.length) return;
  pushHistory();
  var moved = S.blocks.splice(from, 1)[0];
  S.blocks.splice(to, 0, moved);
  note('Reordered ' + def(moved.type).label.toLowerCase());
  await rerender();
  renderTop(); renderRail(); renderChanges(); scheduleSave();
  say(def(moved.type).label + ' moved to position ' + (to + 1) + ' of ' + S.blocks.length);
  var row = el.edRail.querySelector('.ed-row[data-id="' + id + '"]');
  if (row) row.focus();
}

// Clicking a palette chip appends. The youth director will use clicks, not drags.
async function addBlock(type) {
  var block = await freshBlock(type);
  pushHistory();
  S.blocks.push(block);
  S.selectedId = block.id;
  note('Added ' + def(type).label.toLowerCase());
  await rerender();
  renderTop(); renderRail(); renderChanges(); scheduleSave();
  say(def(type).label + ' added at the end of the page');
  var node = blockNode(block.id);
  if (node && node.scrollIntoView) node.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function bindDragAndDrop() {
  // rail rows
  el.edRail.addEventListener('dragstart', function (e) {
    var row = e.target.closest('.ed-row');
    if (!row) return;
    S.dragId = row.dataset.id;
    S.dragType = null;
    row.classList.add('is-dragging');
    if (e.dataTransfer) {
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', row.dataset.id); } catch (_) {}
    }
  });
  el.edRail.addEventListener('dragover', function (e) {
    var row = e.target.closest('.ed-row');
    if (row) overItem(e, Number(row.dataset.index), row);
    else overContainer(e);
  });
  el.edRail.addEventListener('drop', performDrop);
  el.edRail.addEventListener('dragend', clearDrag);

  // canvas — the ⠿ Move handle in the block toolbar starts the drag
  el.edPaper.addEventListener('dragstart', function (e) {
    var handle = e.target.closest('[data-act="move"]');
    if (!handle) { e.preventDefault(); return; }
    var wrap = handle.closest('.tlcb');
    S.dragId = wrap.dataset.id;
    S.dragType = null;
    if (e.dataTransfer) {
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', wrap.dataset.id); } catch (_) {}
    }
  });
  el.edCanvas.addEventListener('dragover', function (e) {
    var wrap = e.target.closest('.tlcb');
    if (wrap) overItem(e, indexOfBlock(wrap.dataset.id), wrap);
    else overContainer(e);
  });
  el.edCanvas.addEventListener('drop', performDrop);
  el.edCanvas.addEventListener('dragend', clearDrag);

  // ── the inspector's row lists ──────────────────────────────────────────
  // Delegated off the panel, because it is rebuilt on every change — handlers
  // bound to the rows themselves would be thrown away by the first reorder,
  // so the second drag would silently do nothing. Same trap the gym renter's
  // basket hit in v4.11.0.
  //
  // Deliberately its own small drag rather than a share of the block drag
  // above: that one moves a block between pages and templates and carries the
  // half-width pairing rules with it. This moves an index inside one array.
  el.edInspBody.addEventListener('dragstart', function (e) {
    var grip = e.target.closest ? e.target.closest('.ed-grip') : null;
    if (!grip) { e.preventDefault(); return; }
    var row = grip.closest('.ed-item');
    var list = grip.closest('.ed-rows');
    if (!row || !list) return;
    S.rowDrag = { kind: list.dataset.rows, from: Number(row.dataset.row) };
    if (e.dataTransfer) {
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', String(S.rowDrag.from)); } catch (_) {}
    }
  });
  el.edInspBody.addEventListener('dragover', function (e) {
    if (!S.rowDrag) return;
    var row = e.target.closest ? e.target.closest('.ed-item') : null;
    var list = e.target.closest ? e.target.closest('.ed-rows') : null;
    if (!row || !list || list.dataset.rows !== S.rowDrag.kind) return;
    e.preventDefault();
    // Halfway down the row is the boundary, so the drop lands where the
    // pointer is rather than where the row started.
    var box = row.getBoundingClientRect();
    S.rowDrag.to = Number(row.dataset.row) + (e.clientY > box.top + box.height / 2 ? 1 : 0);
    var rows = list.querySelectorAll('.ed-item');
    for (var i = 0; i < rows.length; i++) {
      rows[i].classList.toggle('is-drop-before', i === S.rowDrag.to);
      rows[i].classList.toggle('is-drop-after', i === rows.length - 1 && S.rowDrag.to >= rows.length);
    }
  });
  el.edInspBody.addEventListener('drop', function (e) {
    if (!S.rowDrag || S.rowDrag.to == null) { S.rowDrag = null; return; }
    e.preventDefault();
    var blk = findBlock(S.selectedId);
    var drag = S.rowDrag;
    S.rowDrag = null;
    if (!blk) return;
    var key = drag.kind === 'cardlink' ? 'cardLinks' : 'items';
    var arr = (blk[key] || []).slice();
    var to = drag.to > drag.from ? drag.to - 1 : drag.to;
    if (to === drag.from || drag.from >= arr.length) { renderInspector(); return; }
    arr.splice(to, 0, arr.splice(drag.from, 1)[0]);
    var pp = {}; pp[key] = arr;
    patch(blk.id, pp, 'Moved a ' + (drag.kind === 'cardlink' ? 'link' : def(blk.type).itemLabel.toLowerCase()), 'rerender');
    say('Moved to position ' + (to + 1));
  });
  el.edInspBody.addEventListener('dragend', function () {
    S.rowDrag = null;
    var rows = el.edInspBody.querySelectorAll('.ed-item');
    for (var i = 0; i < rows.length; i++) rows[i].classList.remove('is-drop-before', 'is-drop-after');
  });

  // ⚠ A photograph dropped anywhere ELSE would make the browser navigate to
  // the file — the editor replaced by a JPEG, and whatever was not yet
  // autosaved gone with it. Missing a 44px thumbnail by half an inch must not
  // cost somebody their afternoon, so a file drop that no field claimed is
  // swallowed here and says where it should have gone.
  ['dragover', 'drop'].forEach(function (type) {
    document.addEventListener(type, function (e) {
      // A picture field claims its own drop on the way up and prevents the
      // default there; only what nothing claimed reaches this.
      if (e.defaultPrevented || !draggingFiles(e)) return;
      e.preventDefault();
      // The cursor says no, so the invitation is not extended to the whole
      // window just because the whole window has to listen.
      if (type === 'dragover') { try { e.dataTransfer.dropEffect = 'none'; } catch (_) {} return; }
      toast('Drop a photo onto a picture field to use it');
    });
  });

  // Dropping a photograph onto a picture field. Delegated off the panel, which
  // is rebuilt on every change — handlers bound to the fields themselves would
  // be thrown away by the first edit, so the second drop would silently do
  // nothing. Same trap the row grips are wired around above.
  //
  // A picture field sits INSIDE a row, so a card being dragged by its grip
  // passes over other cards' thumbnails on the way. What keeps the two apart is
  // that a row drag carries no files, so draggingFiles() is false — the
  // S.rowDrag check below is belt and braces on top of that, said out loud
  // because the two gestures share this element and a future change to either
  // should have to notice.
  ['dragover', 'dragleave', 'drop'].forEach(function (type) {
    el.edInspBody.addEventListener(type, function (e) {
      if (S.rowDrag) return;
      var zone = e.target.closest ? e.target.closest('[data-imgdrop]') : null;
      if (!zone || !draggingFiles(e)) return;
      e.preventDefault();
      if (type === 'dragleave') {
        // Moving over a child fires dragleave on the parent. Only a pointer
        // that has actually left the box should put the highlight out.
        if (zone.contains(e.relatedTarget)) return;
        zone.classList.remove('is-over');
        return;
      }
      if (type === 'dragover') { zone.classList.add('is-over'); return; }
      zone.classList.remove('is-over');
      var file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (file) dropImage(zone, file);
    });
  });

  // palette chips
  el.edPalChips.addEventListener('dragstart', function (e) {
    var c = e.target.closest('.ed-chip');
    if (!c) return;
    S.dragType = c.dataset.type || null;
    S.dragSection = c.dataset.section || null;
    S.dragId = null;
    if (e.dataTransfer) {
      e.dataTransfer.effectAllowed = 'copy';
      try { e.dataTransfer.setData('text/plain', c.dataset.type); } catch (_) {}
    }
  });
  el.edPalChips.addEventListener('dragend', clearDrag);
  el.edPalChips.addEventListener('click', function (e) {
    var x = e.target.closest('[data-del-section]');
    if (x) { e.stopPropagation(); return deleteSection(x.dataset.delSection); }
    var c = e.target.closest('.ed-chip');
    if (!c) return;
    if (c.dataset.section) return insertSection(c.dataset.section, S.blocks.length);
    addBlock(c.dataset.type);
  });

  // Keyboard reordering. HTML5 drag-and-drop is mouse-only and does not work on
  // a tablet at all, so this and the toolbar's ↑ ↓ are not optional extras.
  el.edRail.addEventListener('keydown', function (e) {
    var row = e.target.closest('.ed-row');
    if (!row) return;
    if (e.altKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
      e.preventDefault();
      moveBlock(row.dataset.id, e.key === 'ArrowUp' ? -1 : 1);
      return;
    }
    if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
      e.preventDefault();
      var rows = el.edRail.querySelectorAll('.ed-row');
      var i = Number(row.dataset.index) + (e.key === 'ArrowUp' ? -1 : 1);
      if (!rows[i]) return;
      var nextId = rows[i].dataset.id;
      select(nextId); // this redraws the rail, so re-find the row before focusing
      var moved = el.edRail.querySelector('.ed-row[data-id="' + nextId + '"]');
      if (moved) moved.focus();
    }
  });
}

// ── publishing ─────────────────────────────────────────────────────────────
async function publish() {
  await saveDraft();
  try {
    var out = await api(API + '/page/' + encodeURIComponent(S.slug) + '/publish',
      { method: 'POST', body: JSON.stringify({ blocks: S.blocks }) });
    S.changes = [];
    S.status = 'live';
    S.publishAt = null;
    S.saved = now();
    S.dirty = false;
    closePublishPanel();
    renderTop(); renderChanges();
    toast('Published to timothystl.org' + S.path);
    say('Published');
  } catch (err) {
    if (String(err && err.message) !== 'auth') toast('Could not publish — ' + (err.message || 'try again'));
  }
}

function fmtWhen(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  return d.toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}

// datetime-local wants a local wall-clock string and hands one back with no
// zone. The Worker runs in UTC, so both directions are converted here, in the
// office's own timezone.
function toLocalInput(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  var pad = function (n) { return String(n).padStart(2, '0'); };
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
    'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

function localToIso(value) {
  var d = new Date(value);
  return isNaN(d.getTime()) ? '' : d.toISOString();
}

function closePublishPanel() {
  S.publishPanel = false;
  el.edMore.setAttribute('aria-expanded', 'false');
  el.edPublishPanel.innerHTML = '';
}

async function togglePublishPanel() {
  if (S.publishPanel) return closePublishPanel();
  S.publishPanel = true;
  el.edMore.setAttribute('aria-expanded', 'true');
  renderPublishPanel();
  try {
    var out = await api(API + '/page/' + encodeURIComponent(S.slug) + '/revisions');
    S.revisions = out.revisions || [];
    if (S.publishPanel) renderPublishPanel();
  } catch (_) { /* the panel still works without history */ }
}

function renderPublishPanel() {
  if (!S.publishPanel) return;
  var scheduled = S.status === 'scheduled' && S.publishAt;
  var revs = (S.revisions || []).map(function (r) {
    return '<li class="ed-rev"><span><b>' + esc(fmtWhen(r.published_at)) + '</b><br>' +
      esc(r.published_by || 'staff') + ' · ' + r.count + ' block' + (r.count === 1 ? '' : 's') + '</span>' +
      '<button type="button" class="ed-close" data-restore="' + r.id + '">Restore</button></li>';
  }).join('');
  el.edPublishPanel.innerHTML = '<div class="ed-panel" role="dialog" aria-label="Publishing options">' +
    '<div class="ed-panel-sec"><span class="ed-lab">Status</span>' +
      '<span class="ed-note">' + (scheduled
        ? 'Scheduled for ' + esc(fmtWhen(S.publishAt))
        : (S.changes.length ? S.changes.length + ' unpublished change' + (S.changes.length === 1 ? '' : 's') : 'Everything is published')) + '</span>' +
      '<a class="ed-close" style="display:inline-block;text-align:center" href="https://timothystl.org' + esc(S.path) + '" target="_blank" rel="noopener">Compare with the live page</a>' +
      '<button type="button" class="ed-close" id="edSavePage">Save this whole page as a section</button>' +
    '</div>' +
    '<div class="ed-panel-sec"><label class="ed-lab" for="edWhen">Publish later</label>' +
      '<input class="ed-field" type="datetime-local" id="edWhen" value="' + esc(S.publishAtLocal || '') + '">' +
      '<div style="display:flex;gap:6px">' +
        '<button type="button" class="ed-close" id="edSchedule">Schedule</button>' +
        (scheduled ? '<button type="button" class="ed-close" id="edUnschedule">Cancel schedule</button>' : '') +
      '</div>' +
      '<span class="ed-note">The page goes live on its own within about fifteen minutes of that time.</span>' +
    '</div>' +
    '<div class="ed-panel-sec"><span class="ed-lab">Recently published</span>' +
      (revs ? '<ul class="ed-revs">' + revs + '</ul>' : '<span class="ed-note">Nothing published from this editor yet.</span>') +
      '<span class="ed-note">Restoring loads that version as a draft — nothing changes on the live page until you publish.</span>' +
    '</div></div>';
}

async function schedulePublish(whenIso) {
  try {
    await saveDraft();
    var out = await api(API + '/page/' + encodeURIComponent(S.slug) + '/schedule',
      { method: 'POST', body: JSON.stringify({ publish_at: whenIso }) });
    S.status = out.status;
    S.publishAt = out.publish_at;
    renderTop();
    renderPublishPanel();
    toast(whenIso ? 'Scheduled for ' + fmtWhen(out.publish_at) : 'Schedule cancelled');
  } catch (err) {
    toast(err.message || 'Could not schedule');
  }
}

async function restoreRevision(id) {
  try {
    var out = await api(API + '/page/' + encodeURIComponent(S.slug) + '/restore',
      { method: 'POST', body: JSON.stringify({ id: id }) });
    pushHistory();
    S.blocks = out.blocks;
    S.selectedId = null;
    S.status = 'draft';
    note('Restored an earlier version');
    closePublishPanel();
    setCanvas(out.html);
    renderTop(); renderRail(); renderChanges(); renderInspector();
    toast('Loaded as a draft — publish when you are happy with it');
  } catch (err) {
    toast(err.message || 'Could not restore');
  }
}

// Puts the designer's own layout for this page into the draft. The Worker
// snapshots what is there first — see the note on /use-redesign — so this is
// undoable from the version history, and it never touches the live page.
async function useRedesign() {
  try {
    var out = await api(API + '/page/' + encodeURIComponent(S.slug) + '/use-redesign', { method: 'POST' });
    pushHistory();
    S.blocks = out.blocks;
    S.selectedId = null;
    S.status = 'draft';
    note('Used the redesigned layout');
    setCanvas(out.html);
    renderTop(); renderRail(); renderChanges(); renderInspector();
    toast('The redesigned layout is in your draft — press Publish when you are happy with it');
  } catch (err) {
    toast(err.message || 'Could not load the redesigned layout');
  }
}

function bindPublish() {
  el.edPublish.addEventListener('click', publish);
  el.edMore.addEventListener('click', togglePublishPanel);
  el.edPublishPanel.addEventListener('click', function (e) {
    var rev = e.target.closest('[data-restore]');
    if (rev) return restoreRevision(Number(rev.dataset.restore));
    if (e.target.closest('#edSchedule')) {
      var v = el.edPublishPanel.querySelector('#edWhen').value;
      if (!v) return toast('Pick a date and time first');
      return schedulePublish(localToIso(v));
    }
    if (e.target.closest('#edUnschedule')) return schedulePublish(null);
    if (e.target.closest('#edSavePage')) { closePublishPanel(); return saveSection(S.blocks, S.title); }
  });
  document.addEventListener('click', function (e) {
    if (!S.publishPanel) return;
    if (e.target.closest('#edPublishPanel') || e.target.closest('#edMore')) return;
    closePublishPanel();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && S.publishPanel) closePublishPanel();
  });
}
