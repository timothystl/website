// ── media library ──────────────────────────────────────────────────────────
var lastFocus = null;

// `target` names the field the chosen photo lands in — a spec like
// 'item:2:img', or 'photo' for the block's own. Absent means the block's photo
// or video, which is what every caller before picture fields existed meant.
function openPicker(id, kind, target) {
  lastFocus = document.activeElement;
  S.picker = { id: id, kind: kind, target: target || null, chosen: [], staged: null, error: '' };
  renderModal();
}

function closePicker() {
  S.picker = null;
  renderModal();
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}

function pickerItems() {
  var wantVideo = S.picker.kind === 'video';
  return S.media.filter(function (m) { return (m.kind === 'video') === wantVideo; });
}

function renderModal() {
  if (!S.picker) { el.edModal.innerHTML = ''; return; }
  var p = S.picker;
  var isVideo = p.kind === 'video';
  var isGallery = p.kind === 'gallery';
  var title = isVideo ? 'Video library' : 'Photo library';
  var hint = isVideo
    ? 'Paste a YouTube link, or reuse a video already on the site.'
    : 'Photos are resized for the web as you add them — drop one straight off a phone.';
  var tiles = pickerItems().map(function (m) {
    var chosen = p.chosen.indexOf(m.url) > -1;
    var thumb = isVideo
      ? '<span class="ed-tile-th ed-tile-th--vid">▶</span>'
      : '<span class="ed-tile-th" style="background-image:url(' + esc(m.thumb_url || m.url) + ')"></span>';
    return '<button type="button" class="ed-tile" data-pick="' + esc(m.url) + '" data-alt="' + esc(m.alt || '') + '"' +
      ' data-name="' + esc(m.filename) + '" aria-pressed="' + chosen + '">' + thumb +
      '<span class="ed-tile-n">' + esc(m.filename) + '</span>' +
      '<span class="ed-tile-m">' + esc(m.meta || (isVideo ? 'YouTube' : 'Photo')) + (chosen ? ' · selected' : '') + '</span></button>';
  }).join('');

  var footer;
  if (isVideo) {
    footer = '<input class="ed-field" id="edVidUrl" placeholder="https://youtu.be/…" style="flex:1;min-width:220px">' +
      '<input class="ed-field" id="edVidName" placeholder="What is it called?" style="flex:1;min-width:180px">' +
      '<button type="button" class="ed-upload" id="edVidAdd">Add video</button>';
  } else if (p.staged) {
    // Alt text is required before a photo can join the library.
    footer = '<span class="ed-dropzone" style="flex:0 0 auto;padding:10px 14px">' + esc(p.staged.filename) +
      (p.staged.saved ? '<br><span class="ed-note">' + esc(p.staged.saved) + '</span>' : '') + '</span>' +
      '<input class="ed-field" id="edAltNew" placeholder="Describe this photo (required)" style="flex:1;min-width:220px" autofocus>' +
      '<button type="button" class="ed-upload" id="edStagedAdd">Add to library</button>';
  } else {
    footer = '<label class="ed-dropzone" id="edDrop">Drop a photo here, or choose a file' +
      '<input type="file" id="edFile" accept="image/jpeg,image/png,image/webp,image/gif" style="position:absolute;width:1px;height:1px;opacity:0"></label>' +
      '<button type="button" class="ed-upload" id="edUploadBtn">Upload</button>';
  }

  el.edModal.innerHTML = '<div class="ed-back" id="edBack"><div class="ed-modal" role="dialog" aria-modal="true" aria-label="' + esc(title) + '">' +
    '<div class="ed-modal-h"><b>' + esc(title) + '</b><span>' + esc(hint) + '</span><div style="flex:1"></div>' +
    (isGallery ? '<button type="button" class="ed-upload" id="edGalleryAdd">Add ' + p.chosen.length + ' photo' + (p.chosen.length === 1 ? '' : 's') + '</button>' : '') +
    '<button type="button" class="ed-close" id="edPickerClose">Close</button></div>' +
    '<div class="ed-modal-grid">' + (tiles || '<span class="ed-note">Nothing in the library yet — add something below.</span>') + '</div>' +
    (p.error ? '<div style="padding:8px 20px;color:#B85C3A;font-size:12.5px">' + esc(p.error) + '</div>' : '') +
    '<div class="ed-modal-f">' + footer + '</div>' +
    '</div></div>';

  var first = el.edModal.querySelector('#edAltNew, #edVidUrl, #edPickerClose');
  if (first) first.focus();
}

async function addMedia(payload) {
  var out = await api(API + '/media', { method: 'POST', body: JSON.stringify(payload) });
  S.media.unshift(out.item);
  return out.item;
}

// ── resizing ───────────────────────────────────────────────────────────────
// Photos come off a phone at 3-6MB and 4000px across. The widest a block ever
// draws one is about 860px on a desktop, and the library grid needs a fraction
// of that. Shrinking in the browser before upload keeps the originals off the
// site altogether — no image service, no resize-on-read worker, and the office
// can go on dragging photos straight out of the camera roll.
var MAX_MAIN = 1600;   // enough for a full-bleed hero on a retina screen
var MAX_THUMB = 400;   // the library grid and gallery tiles
var QUALITY = 0.85;
// Every stored image has to come in under a megabyte. Images live in the
// database and are served on every page view, so one 4MB photo off a phone is
// a page nobody on a phone will wait for. The ladder below is tried in order
// until something fits; the server checks the result independently.
var MAX_BYTES = 1048576;
var QUALITY_LADDER = [0.85, 0.72, 0.6, 0.48];
var DIM_LADDER = [1600, 1280, 1000, 800];

function readImage(file) {
  if (window.createImageBitmap) return createImageBitmap(file);
  return new Promise(function (resolve, reject) {
    var img = new Image();
    var url = URL.createObjectURL(file);
    img.onload = function () { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('Could not read that image')); };
    img.src = url;
  });
}

function encode(canvas, type, quality) {
  return new Promise(function (resolve) {
    if (!canvas.toBlob) return resolve(null);
    canvas.toBlob(function (b) { resolve(b && b.type === type ? b : null); }, type, quality === undefined ? QUALITY : quality);
  });
}

// Returns a { blob, filename, width, height } or null when the original should
// be used as-is.
// One pass: draw the source at `maxDim` and encode it at `quality`.
async function encodeAt(src, file, maxDim, quality) {
  var w = src.width, h = src.height;
  if (!w || !h) return null;
  var scale = Math.min(1, maxDim / Math.max(w, h));
  var out = { w: Math.max(1, Math.round(w * scale)), h: Math.max(1, Math.round(h * scale)) };
  var canvas = document.createElement('canvas');
  canvas.width = out.w;
  canvas.height = out.h;
  var ctx = canvas.getContext('2d');
  if (!ctx) return null;
  ctx.drawImage(src, 0, 0, out.w, out.h);

  // WebP first: it is smaller than JPEG at the same quality and, unlike JPEG,
  // it keeps transparency. A PNG logo flattened onto black would be a real
  // regression, so if WebP is unavailable we leave a PNG alone rather than
  // wreck it.
  var blob = await encode(canvas, 'image/webp', quality);
  var ext = 'webp';
  if (!blob) {
    if (/png$/i.test(file.type)) return null;
    blob = await encode(canvas, 'image/jpeg', quality);
    ext = 'jpg';
  }
  if (!blob) return null;
  var base = (file.name || 'photo').replace(/\.[^.]+$/, '').slice(0, 60) || 'photo';
  return { blob: blob, filename: base + '.' + ext, width: out.w, height: out.h, scale: scale };
}

// Returns a { blob, filename, width, height } or null when the original should
// be used as-is. Walks down quality first (invisible at these sizes), then the
// dimension, until the result is under MAX_BYTES — the original phone-camera
// file is never what gets stored.
async function shrink(file, maxDim, cap) {
  // An animated GIF would come out of a canvas as a single frozen frame.
  if (/gif$/i.test(file.type)) return null;
  var limit = cap === undefined ? MAX_BYTES : cap;
  var src;
  try { src = await readImage(file); } catch (_) { return null; }
  var best = null;
  try {
    var dims = DIM_LADDER.filter(function (d) { return d <= maxDim; });
    if (!dims.length) dims = [maxDim];
    for (var i = 0; i < dims.length; i++) {
      for (var q = 0; q < QUALITY_LADDER.length; q++) {
        var got = await encodeAt(src, file, dims[i], QUALITY_LADDER[q]);
        if (!got) return null;                       // cannot re-encode this kind of file
        if (!best || got.blob.size < best.blob.size) best = got;
        if (got.blob.size <= limit) { best = got; i = dims.length; break; }
      }
    }
  } finally {
    if (src.close) src.close();
  }
  if (!best) return null;
  // Re-encoding a small, already-optimized image can make it bigger — but only
  // leave the original in place if it is itself within the limit.
  if (best.blob.size >= file.size && best.scale === 1 && file.size <= limit) return null;
  return best;
}

async function postImage(blob, filename) {
  var fd = new FormData();
  fd.append('file', blob, filename);
  var res = await fetch('/api/upload-image', { method: 'POST', body: fd, credentials: 'same-origin' });
  var j = await res.json().catch(function () { return {}; });
  if (!res.ok || !j.url) throw new Error(j.error || 'Upload failed');
  return j.url;
}

function prettyBytes(n) {
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return Math.round(n / 1024) + ' KB';
  return (n / 1048576).toFixed(1) + ' MB';
}

async function uploadPhoto(file) {
  var main = await shrink(file, MAX_MAIN);
  var url = await postImage(main ? main.blob : file, main ? main.filename : (file.name || 'photo.jpg'));
  var thumbUrl = '';
  try {
    var thumb = await shrink(file, MAX_THUMB, MAX_BYTES);
    if (thumb) thumbUrl = await postImage(thumb.blob, thumb.filename.replace(/(\.[^.]+)$/, '-thumb$1'));
  } catch (_) { /* the full-size image is enough on its own */ }
  return {
    url: url,
    thumb_url: thumbUrl,
    filename: file.name || 'photo.jpg',
    meta: main ? main.width + '×' + main.height : 'Photo',
    // The size actually stored, so the Media screen can flag anything that
    // slipped past the 1MB target without re-fetching every object from R2.
    bytes: main ? main.blob.size : (file.size || 0),
    saved: main ? 'Resized ' + prettyBytes(file.size) + ' ' + prettyBytes(main.blob.size) : '',
  };
}

// Writes a picture address into whichever field asked for it. Its own path
// rather than a share of inspectorInput(): that one is the debounced keystroke
// handler, and choosing a photo is a finished decision — it saves and redraws
// now rather than 700ms after the last thing somebody typed.
function setImageSpec(id, spec, url, name) {
  var b = findBlock(id);
  if (!b) return;
  if (spec === 'photo') {
    patch(id, { photo: url }, 'Changed photo · ' + name, 'rerender');
    return;
  }
  var parts = spec.split(':');
  if (parts[0] !== 'item') return;
  var i = Number(parts[1]);
  var items = (b.items || []).map(function (it) { return Object.assign({}, it); });
  if (!items[i]) return;
  items[i][parts[2]] = url;
  patch(id, { items: items }, 'Changed picture · ' + name, 'rerender');
}

// ⚠ ON dragover THE FILE LIST IS EMPTY. Every browser withholds the files
// until the drop actually happens, so a handler that asks `dataTransfer.files`
// whether this is a file drag says no every time and the field never lights up.
// `types` is the one thing readable the whole way through.
function draggingFiles(e) {
  var t = e.dataTransfer && e.dataTransfer.types;
  if (!t) return false;
  return Array.prototype.indexOf.call(t, 'Files') > -1;
}

// The library refuses a photo with no description, and it is right to — an
// undescribed picture on a church website is one a blind visitor is simply not
// shown. So a drop borrows the description already on the row rather than
// inventing one: for a card grid the heading IS the alt the page renders
// (alt="the card's heading"), so there is nothing extra to type and no second
// copy to fall out of step. With nothing to borrow it says so in a sentence,
// rather than letting the server answer with a 400 nobody can act on.
function altSourceFor(b, spec) {
  if (spec === 'photo') {
    return { text: (b.photoAlt || '').trim(),
      asks: 'Describe the photo in the box below first — a screen reader reads that description in place of the picture.' };
  }
  var parts = spec.split(':');
  var it = (b.items || [])[Number(parts[1])];
  var label = (def(b.type).itemLabel || 'row').toLowerCase();
  return { text: ((it && it.title) || '').trim(),
    asks: 'Give this ' + label + ' a heading first — the heading is what a screen reader reads for the picture.' };
}

async function dropImage(zone, file) {
  var spec = zone.dataset.imgdrop;
  var id = S.selectedId;
  var b = findBlock(id);
  if (!b) return;
  if (!/^image\//.test(file.type)) {
    toast('That is not a picture — drop a JPEG, PNG, WebP or GIF');
    return;
  }
  var alt = altSourceFor(b, spec);
  if (!alt.text) { toast(alt.asks); return; }

  var line = zone.querySelector('.ed-media-c');
  var was = line ? line.textContent : '';
  zone.classList.add('is-busy');
  if (line) line.textContent = 'Adding ' + file.name + '…';
  try {
    var up = await uploadPhoto(file);
    // It joins the library on the way past. A photo that exists only on one
    // card is one nobody can reuse and one the Media screen cannot see to
    // report on — which is where "used nowhere" and the size warnings live.
    var item = await addMedia({
      kind: 'photo', url: up.url, thumb_url: up.thumb_url, filename: up.filename,
      alt: alt.text, meta: up.meta, bytes: up.bytes,
    });
    // ⚠ Re-read the block: the upload is a round trip, and the inspector may
    // have been redrawn or another block selected while it was in flight.
    if (!findBlock(id)) { toast('Photo added to the library'); return; }
    setImageSpec(id, spec, item.url, item.filename);
    toast('Photo added' + (up.saved ? ' · ' + up.saved : ''));
  } catch (err) {
    zone.classList.remove('is-busy');
    if (line) line.textContent = was;
    toast(String((err && err.message) || err) || 'Could not add that photo');
  }
}

function applyMedia(url, alt, name) {
  var p = S.picker;
  if (!p) return;
  var b = findBlock(p.id);
  if (!b) return;
  if (p.target) {
    setImageSpec(p.id, p.target, url, name);
  } else if (p.kind === 'video') {
    patch(p.id, { video: url }, 'Changed video · ' + name, 'rerender');
  } else {
    patch(p.id, { photo: url, photoAlt: alt || b.photoAlt || '' }, 'Changed photo · ' + name, 'rerender');
  }
  closePicker();
}

function bindPicker() {
  el.edModal.addEventListener('click', async function (e) {
    if (!S.picker) return;
    if (e.target.id === 'edBack' || e.target.closest('#edPickerClose')) return closePicker();

    var tile = e.target.closest('[data-pick]');
    if (tile) {
      if (S.picker.kind === 'gallery') {
        var url = tile.dataset.pick;
        var at = S.picker.chosen.indexOf(url);
        if (at > -1) S.picker.chosen.splice(at, 1); else S.picker.chosen.push(url);
        renderModal();
      } else {
        applyMedia(tile.dataset.pick, tile.dataset.alt, tile.dataset.name);
      }
      return;
    }

    if (e.target.closest('#edGalleryAdd')) {
      var b = findBlock(S.picker.id);
      if (!b || !S.picker.chosen.length) return closePicker();
      var items = (b.items || []).slice();
      S.picker.chosen.forEach(function (u) {
        var m = S.media.filter(function (x) { return x.url === u; })[0] || {};
        items.push({ url: u, title: m.alt || m.filename || '' });
      });
      var n = S.picker.chosen.length;
      var id = S.picker.id;
      closePicker();
      patch(id, { items: items }, 'Added ' + n + ' photo' + (n === 1 ? '' : 's') + ' to the gallery', 'rerender');
      return;
    }

    if (e.target.closest('#edUploadBtn')) { el.edModal.querySelector('#edFile').click(); return; }

    if (e.target.closest('#edStagedAdd')) {
      var alt = (el.edModal.querySelector('#edAltNew').value || '').trim();
      if (!alt) { S.picker.error = 'Please describe the photo — it is read aloud to people who cannot see it.'; return renderModal(); }
      try {
        var item = await addMedia({ kind: 'photo', url: S.picker.staged.url, thumb_url: S.picker.staged.thumb_url,
          filename: S.picker.staged.filename, alt: alt, meta: S.picker.staged.meta || 'Photo', bytes: S.picker.staged.bytes || 0 });
        if (S.picker.kind === 'gallery') { S.picker.staged = null; S.picker.error = ''; renderModal(); }
        else applyMedia(item.url, item.alt, item.filename);
      } catch (err) { S.picker.error = String(err.message || err); renderModal(); }
      return;
    }

    if (e.target.closest('#edVidAdd')) {
      var vurl = (el.edModal.querySelector('#edVidUrl').value || '').trim();
      var vname = (el.edModal.querySelector('#edVidName').value || '').trim() || 'Video';
      if (!/youtu\.?be/i.test(vurl)) { S.picker.error = 'Paste a YouTube link (youtube.com or youtu.be).'; return renderModal(); }
      try {
        var v = await addMedia({ kind: 'video', url: vurl, filename: vname, alt: '', meta: 'YouTube' });
        applyMedia(v.url, '', v.filename);
      } catch (err2) { S.picker.error = String(err2.message || err2); renderModal(); }
    }
  });

  el.edModal.addEventListener('change', async function (e) {
    if (e.target.id !== 'edFile' || !e.target.files || !e.target.files[0]) return;
    try {
      S.picker.staged = await uploadPhoto(e.target.files[0]);
      S.picker.error = '';
    } catch (err) { S.picker.error = String(err.message || err); }
    renderModal();
  });

  ['dragover', 'dragleave', 'drop'].forEach(function (type) {
    el.edModal.addEventListener(type, async function (e) {
      var zone = e.target.closest ? e.target.closest('#edDrop') : null;
      if (!zone) return;
      e.preventDefault();
      zone.classList.toggle('is-over', type === 'dragover');
      if (type !== 'drop') return;
      var file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (!file) return;
      try {
        S.picker.staged = await uploadPhoto(file);
        S.picker.error = '';
      } catch (err) { S.picker.error = String(err.message || err); }
      renderModal();
    });
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && S.picker) { e.stopPropagation(); closePicker(); }
  }, true);
}

// Test seam: the browser tests assert that styleVars() produces byte-identical
// output to wrapperVars() in admin/blocks.js. Pure function, no state.
window.__edStyleVars = styleVars;
window.__edShrink = shrink;

// ── boot ───────────────────────────────────────────────────────────────────
async function boot() {
  var root = document.getElementById('root');
  root.innerHTML = shellHtml();
  cacheEls();
  try { if (localStorage.getItem(HINT_KEY)) { S.hint = false; el.edHint.style.display = 'none'; } } catch (_) {}
  // The root class the phone layout keys off. Applied always — above the
  // breakpoint the CSS ignores it — so there is one starting state rather than
  // one that depends on the width at boot.
  setMobileView('canvas');
  // ⚠ The tip is four instructions and on a phone all four are wrong: there is
  // no left rail beside the page, the panel is not at the bottom, and nothing
  // drags. It is the first thing anybody reads, so it says what is true here.
  if (isNarrow() && el.edHint) {
    var span = el.edHint.querySelector('span');
    if (span) {
      span.textContent = 'use the bar at the bottom to move between the page, its blocks and their settings'
        + ' \u00b7 tap any text to type \u00b7 tap a block in Add block to put it on the page'
        + ' \u00b7 the arrows on a block move it';
    }
  }
  bindStatic();
  try {
    var data = await api(API + '/page/' + encodeURIComponent(S.slug));
    S.title = data.page.title;
    S.status = data.page.status;
    S.publishAt = data.page.publish_at || null;
    S.publishAtLocal = toLocalInput(S.publishAt);
    S.blocks = data.page.blocks;
    S.changes = data.page.changes || [];
    S.updatedAt = data.page.updated_at || '';
    S.config = data.config;
    // Every address on this site that answers — pages, their short links and
    // redirects. ⚠ NOT data.pages, which is the rail's list and is filtered by
    // what this person may EDIT: a ministry leader who can only open their own
    // page still needs to link to /worship.
    S.linkTargets = data.linkTargets || [];
    // Whether a designer-authored layout exists for THIS page. Sent by the
    // Worker rather than worked out here, so the editor never offers a button
    // that would come back "there is no redesigned layout for this page".
    S.hasRedesign = !!data.hasRedesign;
    S.media = data.media || [];
    S.path = data.page.path || ('/' + S.slug);
    S.template = data.page.template || '';
    S.siblings = data.pages || [];
    S.pageMeta = data.page.settings || null;
    S.role = data.role || 'office';
    S.editors = data.editors || [];
    if (IS_SITE_PAGE && /(\?|&)tab=page(&|$)/.test(location.search)) S.tab = 'page';
    setCanvas(data.html);
    setDevice('desktop');
    renderAll();
    loadSections();
  } catch (err) {
    if (String(err && err.message) === 'auth') return;
    root.innerHTML = '<div class="ed-boot">Could not load this page — <a href="' + BACK_HREF + '" style="color:#2E7EA6;margin-left:6px">back to ' + BACK_LABEL + '</a></div>';
  }
}

boot();
})();
</script>
</body>
