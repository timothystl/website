<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ministry page editor — Timothy Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- The admin chrome stays Lora + Source Sans. These two are the SITE's other
     typeface pair, loaded here only so the header preview and the editor canvas
     can draw the site in whatever pair is published — a preview in the admin's
     own fonts is the same class of lie the preview exists to end. Nothing in
     the admin's own furniture uses them. -->
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Source+Sans+3:wght@300;400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&display=swap" rel="stylesheet">
<style>
/* ── Editor chrome ────────────────────────────────────────────────────────
   Colors and type come from the live site's palette (see CLAUDE.md → Design
   System). Block styling itself is NOT here — it ships with the rendered
   block HTML from admin/blocks.js, so the canvas and the public page cannot
   drift apart. */
*{box-sizing:border-box;}
html,body{margin:0;height:100%;background:#E7E2D8;font-family:'Source Sans 3',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#1A1A2A;}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
::selection{background:#F5E4C0;}
:focus-visible{outline:2px solid #2E7EA6;outline-offset:2px;}

.ed{height:100vh;display:flex;flex-direction:column;background:#FBF8F3;overflow:hidden;}

/* top bar */
.ed-top{display:flex;align-items:center;gap:14px;padding:0 18px;height:58px;background:#1E2D4A;color:#EDF2F7;flex:none;}
.ed-brand{display:flex;align-items:center;gap:10px;padding-right:16px;border-right:1px solid rgba(237,242,247,.18);}
.ed-mark{width:26px;height:26px;border-radius:6px;background:#C9973A;color:#1E2D4A;font:600 13px/26px 'Source Sans 3';text-align:center;}
.ed-brand span{font:600 14px/1 'Source Sans 3';white-space:nowrap;}
.ed-crumb{display:flex;align-items:center;gap:8px;font-size:14px;color:#C4CEDF;min-width:0;}
.ed-crumb a{color:#C4CEDF;text-decoration:none;}
.ed-crumb a:hover{color:#FBF8F3;}
.ed-crumb i{opacity:.5;font-style:normal;}
.ed-crumb b{color:#FBF8F3;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ed-pill{padding:4px 10px;border-radius:999px;font:600 11px/1.4 'Source Sans 3';letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;}
.ed-pill--draft{background:rgba(201,151,58,.18);border:1px solid rgba(232,192,112,.5);color:#E8C070;}
.ed-pill--live{background:rgba(220,230,214,.18);border:1px solid rgba(160,190,150,.5);color:#C6DDBB;}
.ed-saved{font-size:12.5px;color:#93A2B8;white-space:nowrap;}
.ed-spacer{flex:1;}
.ed-devices{display:flex;padding:3px;background:rgba(17,30,50,.55);border-radius:9px;gap:2px;}
.ed-devices button{padding:5px 12px;border-radius:7px;font:500 13px/1.2 'Source Sans 3';color:#C4CEDF;}
.ed-devices button[aria-pressed="true"]{background:#EDF2F7;color:#1E2D4A;font-weight:600;}
.ed-undo{padding:8px 13px;border:1px solid rgba(196,206,223,.45);border-radius:8px;font:600 13px/1 'Source Sans 3';color:#EDF2F7;}
.ed-undo[disabled]{opacity:.4;cursor:default;}
.ed-publish{padding:9px 16px;background:#C9973A;color:#1B1608;border-radius:8px;font:700 13px/1 'Source Sans 3';}
.ed-publish:hover{background:#DBAA4E;}
.ed-publish[disabled]{opacity:.5;cursor:default;}
.ed-view{color:#C4CEDF;font:600 13px/1 'Source Sans 3';text-decoration:none;padding:8px 6px;white-space:nowrap;}
.ed-view:hover{color:#FBF8F3;}

/* hint strip */
.ed-hint{display:flex;align-items:center;gap:8px;padding:7px 18px;background:#F7F3EC;border-bottom:1px solid #DDE3ED;font-size:12.5px;color:#6A6858;flex:none;}
.ed-hint b{color:#C9973A;font-weight:700;}
.ed-hint button{margin-left:auto;color:#8A8898;font-size:16px;line-height:1;padding:2px 6px;}

.ed-body{flex:1;display:flex;min-height:0;}

/* rail */
.ed-rail{width:266px;flex:none;border-right:1px solid #DDE3ED;background:#F7F3EC;display:flex;flex-direction:column;min-height:0;}
.ed-rail-h{padding:15px 16px 9px;display:flex;align-items:center;justify-content:space-between;gap:6px;
  font:600 11px/1 'Source Sans 3';letter-spacing:.14em;text-transform:uppercase;color:#8A8898;}
.ed-rail-h button{background:none;border:none;cursor:pointer;color:#8A8898;font-size:14px;line-height:1;padding:2px 4px;}
.ed-rail-h button:hover{color:#1E2D4A;}
.ed-rail-list{flex:1;overflow-y:auto;padding:0 12px 12px;display:flex;flex-direction:column;gap:5px;}
.ed-row{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;font-size:13.5px;cursor:pointer;text-align:left;width:100%;
  background:#FBF8F3;border:1px solid #DDE3ED;color:#1E2D4A;}
.ed-row[aria-selected="true"]{background:#E4EEF4;border-color:#2E7EA6;font-weight:600;}
.ed-row.is-hidden .ed-row-label{color:#8A8898;}
/* A paired row is bracketed down the left edge, so you can see two blocks sit
   side by side without going to the canvas. Dragging one out breaks the pair
   and the bracket goes with it, because it is computed from the list. */
.ed-row--run-top,.ed-row--run-bottom{position:relative;margin-left:9px;}
.ed-row--run-top::before,.ed-row--run-bottom::before{content:'';position:absolute;left:-9px;width:7px;
  border-left:2px solid #2E7EA6;}
.ed-row--run-top::before{top:8px;bottom:-4px;border-top:2px solid #2E7EA6;border-radius:3px 0 0 0;}
.ed-row--run-bottom::before{top:-4px;bottom:8px;border-bottom:2px solid #2E7EA6;border-radius:0 0 0 3px;}
.ed-row.is-dragging{opacity:.4;}
.ed-row-grip{color:#B8BECB;font-size:13px;cursor:grab;}
.ed-row-glyph{width:16px;text-align:center;color:#2E7EA6;}
.ed-row-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ed-row-tag{font-size:10.5px;padding:1px 5px;border:1px solid #DDE3ED;border-radius:4px;color:#8A8898;}
.ed-drop{height:2px;background:#C9973A;border-radius:2px;margin:1px 0;flex:none;}
.ed-rail-empty{padding:22px 12px;border:1.5px dashed #C4CEDF;border-radius:10px;text-align:center;font-size:12.5px;color:#8A8898;line-height:1.5;}
.ed-rail-f{padding:12px;border-top:1px solid #DDE3ED;text-align:center;font-size:11.5px;color:#8A8898;}

/* canvas */
.ed-mid{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;background:#E7E2D8;}
.ed-canvas{flex:1;overflow:auto;padding:24px 24px 30px;display:block;}
.ed-paper{background:#FBF8F3;border-radius:10px;box-shadow:0 6px 30px rgba(30,45,74,.14);padding:18px;margin:0 auto;
  flex:0 0 auto;min-height:420px;width:860px;transition:width .18s ease;}
.ed-paper .tlcb-page{--tlcb-pad:34px;}
.ed-paper .tlcb-page--full{--tlcb-wrap:100%;}
.ed-paper--phone .tlcb-page{--tlcb-pad:18px;}
/* Selection + per-block editor controls, layered over the shared block markup */
.ed-paper .tlcb{cursor:pointer;}
.ed-paper .tlcb.is-sel{border-color:#2E7EA6;}
.ed-paper .tlcb-tools,.ed-paper .tlcb-badge,.ed-paper .tlcb-pick{display:none;}
.ed-paper .tlcb.is-sel > .tlcb-tools{display:flex;align-items:center;gap:1px;position:absolute;top:-33px;left:-2px;z-index:5;
  padding:3px;background:#1E2D4A;border-radius:8px;box-shadow:0 3px 14px rgba(30,45,74,.3);white-space:nowrap;}
.ed-paper .tlcb-tool{padding:4px 8px;color:#C4CEDF;font-size:12.5px;}
.ed-paper .tlcb-tool:hover{color:#FBF8F3;}
.ed-paper .tlcb-tool--drag{cursor:grab;}
.ed-paper .tlcb-tool--del{color:#E8A0A0;}
.ed-paper .tlcb-tool--del:hover{color:#FFC9C9;}
.ed-paper .tlcb-tool-div{width:1px;height:15px;background:rgba(196,206,223,.3);}
.ed-paper .tlcb.is-sel > .tlcb-badge{display:block;position:absolute;top:-33px;right:-2px;padding:5px 10px;background:#2E7EA6;color:#fff;
  border-radius:8px;font:700 10.5px/1.3 'Source Sans 3';letter-spacing:.08em;text-transform:uppercase;z-index:5;white-space:nowrap;}
.ed-paper .tlcb.is-sel .tlcb-pick{display:inline-block;position:absolute;top:10px;right:10px;z-index:3;padding:6px 11px;
  background:rgba(251,248,243,.94);border-radius:7px;font:600 12px/1 'Source Sans 3';color:#1E2D4A;}
.ed-paper .tlcb .tlcb-pick--inline{position:static;display:none;}
.ed-paper .tlcb.is-sel .tlcb-pick--inline{display:inline-block;align-self:flex-start;padding:7px 12px;border:1px solid #C4CEDF;background:#FBF8F3;}
.ed-paper [contenteditable]{outline:none;}
.ed-paper [contenteditable]:focus{box-shadow:0 0 0 2px rgba(46,126,166,.35);border-radius:4px;}
.ed-paper .tlcb-media{position:relative;}
.ed-canvas-drop{position:relative;height:3px;background:#C9973A;border-radius:3px;box-shadow:0 0 0 4px rgba(201,151,58,.16);margin:6px 0;}
.ed-canvas-drop span{position:absolute;left:50%;transform:translateX(-50%);top:-24px;padding:3px 9px;background:#C9973A;color:#1B1608;
  border-radius:6px;font:700 10.5px/1.5 'Source Sans 3';letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;}

/* palette */
.ed-pal{flex:none;border-top:1px solid #DDE3ED;background:#1E2D4A;}
.ed-pal-h{display:flex;align-items:center;gap:8px;padding:8px 14px 0;}
.ed-pal-scroll{flex:1;min-width:0;display:flex;align-items:center;gap:4px;overflow-x:auto;}
.ed-pal-label{flex:none;padding:8px 8px 8px 2px;color:#93A2B8;font:600 12.5px/1 'Source Sans 3';}
.ed-pal-tab{flex:none;white-space:nowrap;padding:7px 11px;border-radius:8px;font:500 12.5px/1 'Source Sans 3';color:#C4CEDF;}
.ed-pal-tab[aria-pressed="true"]{background:#EDF2F7;color:#1E2D4A;font-weight:600;}
.ed-pal-toggle{flex:none;padding:7px 11px;border:1px solid rgba(196,206,223,.35);border-radius:7px;color:#C4CEDF;font:600 12px/1 'Source Sans 3';white-space:nowrap;}
.ed-pal-chips{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:10px 14px 12px;}
.ed-chip{padding:9px 13px;background:rgba(237,242,247,.1);border-radius:9px;color:#EDF2F7;font:500 12.5px/1 'Source Sans 3';cursor:grab;}
.ed-chip:hover{background:rgba(237,242,247,.22);}
.ed-chip--saved{display:inline-flex;align-items:center;gap:8px;}
.ed-chip-n{font-size:10.5px;color:#93A2B8;border:1px solid rgba(196,206,223,.35);border-radius:5px;padding:0 5px;}
.ed-chip-x{color:#93A2B8;font-size:14px;line-height:1;padding:0 2px;}
.ed-chip-x:hover{color:#FFC9C9;}

/* inspector */
.ed-insp{width:318px;flex:none;border-left:1px solid #DDE3ED;background:#FBF8F3;display:flex;flex-direction:column;min-height:0;}
.ed-tabs{display:flex;gap:2px;padding:8px 10px 0;border-bottom:1px solid #DDE3ED;}
.ed-tabs button{padding:7px 14px;border-radius:8px 8px 0 0;font:500 13px/1 'Source Sans 3';color:#8A8898;
  border:1px solid transparent;border-bottom:none;background:none;cursor:pointer;margin-bottom:-1px;}
.ed-tabs button[aria-selected="true"]{background:#FBF8F3;border-color:#DDE3ED;color:#1E2D4A;font-weight:600;}
/* Page tab */
.ed-field{display:flex;flex-direction:column;gap:5px;}
.ed-field input[type="text"],.ed-field textarea,.ed-field select{width:100%;padding:8px 10px;border:1px solid #DDE3ED;
  border-radius:8px;font:400 13.5px/1.4 'Source Sans 3';color:#1E2D4A;background:#fff;}
.ed-field textarea{resize:vertical;min-height:64px;}
.ed-field input[readonly]{background:#F2EFE8;color:#6A6858;}
.ed-addr{display:flex;align-items:center;border:1px solid #DDE3ED;border-radius:8px;background:#F2EFE8;overflow:hidden;}
.ed-addr span{padding:8px 0 8px 10px;font-size:13px;color:#8A8898;white-space:nowrap;}
.ed-addr input{border:none;background:none;flex:1;min-width:0;padding:8px 10px 8px 2px;
  font:400 13.5px/1.4 'Source Sans 3';color:#1E2D4A;}
.ed-menu-opts{display:flex;flex-direction:column;gap:3px;max-height:230px;overflow-y:auto;}
.ed-menu-opt{text-align:left;padding:8px 11px;border:1px solid #DDE3ED;border-radius:8px;background:#fff;
  font:400 13px/1.3 'Source Sans 3';color:#4A4860;cursor:pointer;}
.ed-menu-opt[aria-pressed="true"]{border:2px solid #2E7EA6;background:#E4EEF4;color:#1E2D4A;font-weight:600;}
.ed-check{display:flex;align-items:center;gap:8px;font-size:13px;color:#1E2D4A;cursor:pointer;}
.ed-count{font-size:11.5px;color:#8A8898;}
.ed-count.is-over{color:#B85C3A;font-weight:600;}
.ed-fills{border:1px solid #C4CEDF;border-radius:9px;background:#EDF2F7;padding:11px 12px;
  display:flex;flex-direction:column;gap:9px;}
.ed-fills .ed-lab{color:#1E5C7A;}
.ed-fills p{margin:0;font-size:12.5px;line-height:1.5;color:#3A4E5C;}
.ed-danger{padding:8px 12px;border:1px solid #E3C4B8;border-radius:8px;background:#fff;
  color:#8A3A1F;font:500 12.5px/1 'Source Sans 3';cursor:pointer;align-self:flex-start;}
.ed-insp-h{padding:14px 16px;border-bottom:1px solid #DDE3ED;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.ed-insp-h b{font:600 15px/1 'Source Sans 3';color:#1E2D4A;}
.ed-insp-h span{font-size:12px;color:#8A8898;white-space:nowrap;}
.ed-insp-body{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:15px;}
.ed-none{padding:22px 18px;display:flex;flex-direction:column;gap:9px;}
.ed-none b{font:500 16px/1.3 Lora,Georgia,serif;color:#1E2D4A;font-weight:500;}
.ed-none span{font-size:13px;color:#8A8898;line-height:1.5;}
.ed-sec{display:flex;flex-direction:column;gap:8px;}
.ed-sec--rule{padding-top:11px;border-top:1px solid #DDE3ED;}
.ed-lab{font:600 11px/1 'Source Sans 3';letter-spacing:.12em;text-transform:uppercase;color:#8A8898;}
.ed-lab-row{display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
.ed-read{font-size:12px;color:#4A4860;}
.ed-note{font-size:11.5px;color:#8A8898;line-height:1.4;}
.ed-chips{display:flex;gap:6px;flex-wrap:wrap;}
.ed-pick{flex:1;padding:6px 4px;text-align:center;border-radius:7px;font:500 12.5px/1.2 'Source Sans 3';border:1px solid #DDE3ED;color:#4A4860;background:#fff;}
.ed-pick[aria-pressed="true"]{border:2px solid #2E7EA6;background:#E4EEF4;color:#1E2D4A;font-weight:600;}
.ed-step-row{display:flex;align-items:center;gap:8px;font-size:13px;color:#1E2D4A;}
.ed-step-row > span:first-child{flex:1;}
.ed-step{display:flex;align-items:center;border:1px solid #DDE3ED;border-radius:7px;overflow:hidden;background:#fff;}
.ed-step button{padding:4px 9px;color:#4A4860;}
.ed-step button:first-child{border-right:1px solid #DDE3ED;}
.ed-step button:last-child{border-left:1px solid #DDE3ED;}
.ed-step button:hover{background:#EDF2F7;}
.ed-step output{padding:4px 10px;font:600 12.5px/1.4 'Source Sans 3';min-width:38px;text-align:center;}
.ed-sw{width:30px;height:30px;border-radius:7px;border:1px solid #DDE3ED;padding:0;}
.ed-sw[aria-pressed="true"]{border:2px solid #2E7EA6;box-shadow:0 0 0 2px rgba(46,126,166,.2);}
.ed-sw[aria-disabled="true"]{border:1px dashed #DDE3ED;opacity:.3;cursor:not-allowed;}
.ed-media{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid #DDE3ED;border-radius:9px;background:#F7F3EC;width:100%;text-align:left;}
.ed-media:hover{border-color:#2E7EA6;}
.ed-media-thumb{width:44px;height:44px;border-radius:6px;flex:none;background:#E4EAF2 center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:#8A8898;}
.ed-media-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.ed-media-n{font-size:13px;color:#1E2D4A;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ed-media-c{font-size:12px;color:#2E7EA6;}
.ed-img{display:flex;flex-direction:column;gap:6px;}
.ed-img.is-over .ed-media{border-color:#2E7EA6;background:#F2F7FA;box-shadow:0 0 0 2px rgba(46,126,166,.2);}
.ed-img.is-busy .ed-media{opacity:.55;}
.ed-img.is-busy .ed-media-c{color:#8A8898;}
.ed-track{width:40px;height:22px;border-radius:999px;position:relative;display:inline-block;background:#DDE3ED;flex:none;padding:0;}
.ed-track[aria-pressed="true"]{background:#4A5E3A;}
.ed-knob{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#FBF8F3;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .12s ease;}
.ed-track[aria-pressed="true"] .ed-knob{left:21px;}
.ed-reassure{display:flex;gap:9px;padding:10px;border:1px solid #DCE6D6;border-radius:9px;background:#F2F6EF;}
.ed-reassure i{color:#4A5E3A;font-size:13px;line-height:1.3;font-style:normal;}
.ed-reassure span{font-size:11.5px;line-height:1.45;color:#3B4C2E;}
.ed-reset{align-self:flex-start;padding:7px 12px;border:1px solid #C4CEDF;border-radius:7px;font:600 12.5px/1 'Source Sans 3';color:#1E2D4A;}
.ed-reset:hover{background:#EDF2F7;}
.ed-field{width:100%;padding:8px 10px;border:1px solid #DDE3ED;border-radius:7px;font:400 13px/1.4 'Source Sans 3';background:#fff;color:#1E2D4A;}
.ed-item{border:1px solid #DDE3ED;border-radius:8px;padding:9px;background:#fff;display:flex;flex-direction:column;gap:6px;}
.ed-item-h{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:#8A8898;}
.ed-item-h button{color:#B85C3A;font-size:11.5px;font-weight:600;}
.ed-item-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ed-link{display:flex;flex-direction:column;gap:5px;}
/* Deliberately below the box, not beside it: the picker is the ordinary way
   in, and the box is for the address that is not a page on this site. */
.ed-linkpick{width:100%;font-size:12px;padding:6px 7px;border:1px solid #DDE3ED;border-radius:6px;
  background:#F7F9FC;color:#4A5568;}
.ed-linkwarn{font-size:11.5px;line-height:1.45;color:#8C3A28;}
.ed-linkwarn:empty{display:none;}
.ed-grip{cursor:grab;color:#A8A69A;font-size:12px;line-height:1;flex:none;user-select:none;}
.ed-grip:active{cursor:grabbing;}
.ed-move{color:#4A5568!important;font-size:12px!important;line-height:1;padding:2px 4px;border-radius:5px;flex:none;}
.ed-move:hover:not(:disabled){background:#EDF2F7;}
.ed-move:disabled{opacity:.28;cursor:default;}
.ed-rows{display:flex;flex-direction:column;gap:6px;}
/* The drop line, drawn on the row the pointer is over rather than by moving
   the rows themselves — a list that reflows under a dragging cursor is a list
   you cannot aim at. */
.ed-item.is-drop-before{box-shadow:0 -2px 0 0 #2E7EA6;}
.ed-item.is-drop-after{box-shadow:0 2px 0 0 #2E7EA6;}
.ed-add{align-self:flex-start;padding:6px 11px;border:1px solid #C4CEDF;border-radius:7px;font:600 12.5px/1 'Source Sans 3';color:#1E2D4A;}

/* changes panel */
.ed-changes{flex:none;padding:13px 16px;border-top:1px solid #DDE3ED;display:flex;flex-direction:column;gap:9px;background:#F7F3EC;}
.ed-changes ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;max-height:132px;overflow-y:auto;font-size:12.5px;color:#4A4860;}
.ed-changes .ed-none-yet{color:#8A8898;}

/* modal */
.ed-back{position:fixed;inset:0;background:rgba(17,30,50,.5);display:flex;align-items:center;justify-content:center;z-index:60;padding:34px;}
.ed-modal{width:760px;max-width:100%;max-height:82vh;background:#FBF8F3;border-radius:14px;box-shadow:0 24px 70px rgba(17,30,50,.4);display:flex;flex-direction:column;overflow:hidden;}
.ed-modal-h{padding:16px 20px;border-bottom:1px solid #DDE3ED;display:flex;align-items:center;gap:12px;}
.ed-modal-h b{font:500 19px/1.2 Lora,Georgia,serif;color:#1E2D4A;font-weight:500;}
.ed-modal-h span{font-size:12.5px;color:#8A8898;}
.ed-modal-grid{flex:1;overflow-y:auto;padding:18px 20px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.ed-tile{display:flex;flex-direction:column;gap:7px;padding:8px;border:1px solid transparent;border-radius:10px;text-align:left;}
.ed-tile:hover,.ed-tile[aria-pressed="true"]{border-color:#2E7EA6;background:#F2F7FA;}
.ed-tile-th{aspect-ratio:4/3;border-radius:8px;background:#DDE3ED center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:#1E2D4A;}
.ed-tile-th--vid{aspect-ratio:16/9;background-color:#1E2D4A;color:#FBF8F3;font-size:24px;}

.ed-dropzone.is-over{border-color:#2E7EA6;background:#F2F7FA;}
.ed-upload{padding:10px 15px;background:#1E2D4A;color:#F5E4C0;border-radius:8px;font:700 13px/1 'Source Sans 3';}
.ed-close{padding:6px 11px;border:1px solid #C4CEDF;border-radius:7px;font:600 12.5px/1 'Source Sans 3';color:#1E2D4A;}
.ed-close:hover{background:#EDF2F7;}

/* publishing panel */
.ed-panel{position:fixed;top:64px;right:18px;width:330px;max-height:calc(100vh - 84px);overflow-y:auto;z-index:65;
  background:#FBF8F3;border:1px solid #DDE3ED;border-radius:12px;box-shadow:0 18px 50px rgba(17,30,50,.28);
  display:flex;flex-direction:column;}
.ed-panel-sec{padding:14px 16px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid #DDE3ED;}
.ed-panel-sec:last-child{border-bottom:0;}
.ed-revs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:210px;overflow-y:auto;}
.ed-rev{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;color:#4A4860;
  padding:8px 10px;border:1px solid #DDE3ED;border-radius:8px;background:#fff;}
.ed-rev b{color:#1E2D4A;}
.ed-publish-more{padding:9px 9px;border-radius:8px;}

/* toast + live region */
.ed-toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);padding:12px 20px;background:#1E2D4A;color:#F5E4C0;border-radius:10px;
  box-shadow:0 12px 34px rgba(17,30,50,.4);font:600 13.5px/1.3 'Source Sans 3';z-index:70;}
.ed-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
.ed-boot{display:flex;align-items:center;justify-content:center;height:100vh;color:#6A6858;font-size:14px;}

/* Blocks laid out as they would be on a phone, scoped to the paper rather than
   the viewport. Injected from admin/blocks.js so it stays identical to the
   media query the public page uses. */
/*TLCB_EDITOR_CSS*/

/* ── Pages rail ──────────────────────────────────────────────────────────
   The far-left column: every page on the site, in menu order. Only drawn for
   the site editor — a ministry page has no siblings to switch between. */
.ed-pages{width:224px;flex:none;border-right:1px solid #DDE3ED;background:#FBF8F3;
  display:flex;flex-direction:column;min-height:0;position:relative;z-index:5;}
.ed-pages-h{padding:15px 14px 9px;display:flex;align-items:center;justify-content:space-between;gap:6px;
  font:600 11px/1 'Source Sans 3';letter-spacing:.14em;text-transform:uppercase;color:#8A8898;}
.ed-pages-h button{background:none;border:none;cursor:pointer;color:#8A8898;font-size:14px;line-height:1;padding:2px 4px;}
.ed-pages-search{margin:0 12px 8px;padding:7px 10px;border:1px solid #DDE3ED;border-radius:8px;
  font:400 13px/1.2 'Source Sans 3';color:#1E2D4A;background:#fff;width:calc(100% - 24px);}
.ed-pages-list{flex:1;overflow-y:auto;padding:0 8px 10px;display:flex;flex-direction:column;gap:1px;}
.ed-page{display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:8px;text-decoration:none;
  font:400 13.5px/1.3 'Source Sans 3';color:#3A3A4A;border:1px solid transparent;background:none;
  text-align:left;cursor:pointer;width:100%;}
.ed-page:hover{background:#EDF2F7;}
.ed-page.is-here{background:#EDF2F7;border-color:#C4CEDF;color:#1E2D4A;font-weight:600;}
.ed-page--child{padding-left:24px;font-size:13px;}
.ed-page-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ed-page-dot{width:7px;height:7px;border-radius:50%;background:#C9973A;flex:none;}
.ed-page-tag{font-size:10px;color:#8A8898;flex:none;}
.ed-pages-f{padding:10px 12px;border-top:1px solid #DDE3ED;display:flex;flex-direction:column;gap:6px;}
.ed-pages-f a,.ed-pages-f button{display:block;text-align:center;padding:8px;border-radius:8px;
  font:600 12.5px/1 'Source Sans 3';text-decoration:none;cursor:pointer;}
.ed-pages-f a{border:1px solid #C4CEDF;color:#1E2D4A;background:#fff;}
.ed-pages-f button{border:1px solid #DDE3ED;color:#4A4860;background:none;}
.ed-pages-none{padding:14px 10px;font-size:12.5px;color:#8A8898;text-align:center;}
/* Collapsed: a hairline strip with just the reopen arrow. */
.ed-pages--shut{width:26px;}
.ed-pages--shut .ed-pages-search,.ed-pages--shut .ed-pages-list,
.ed-pages--shut .ed-pages-f,.ed-pages--shut .ed-pages-h span{display:none;}
.ed-pages--shut .ed-pages-h{padding:12px 4px;justify-content:center;}
/* Both left rails fold away to a 26px spine, so the page being edited gets the
   width. They collapse independently — the outline is the one you want while
   restructuring, the page list the one you want while moving between pages,
   and they are rarely both wanted at once. */
.ed-rail--shut{width:26px;}
.ed-rail--shut .ed-rail-list,.ed-rail--shut .ed-rail-f,.ed-rail--shut .ed-rail-h span{display:none;}
.ed-rail--shut .ed-rail-h{padding:12px 4px;justify-content:center;}

@media(max-width:1100px){
  .ed-rail{width:216px;}
  .ed-insp{width:280px;}
}
/* Below 1240px the open pages rail floats OVER the canvas instead of taking a
   column of its own. Left as a flex column, the four columns together exceed
   the viewport and the inspector is pushed off-screen with no way to reach
   it — which is exactly what happened in the prototype. */
@media(max-width:1240px){
  .ed-pages{position:absolute;left:0;top:0;bottom:0;box-shadow:6px 0 20px rgba(30,45,74,.14);}
  .ed-pages--shut{position:static;box-shadow:none;}
  .ed-body{position:relative;}
}

/* The bottom bar itself. Hidden above the breakpoint, so it costs a desktop
   nothing but the markup.
   ⚠ DECLARED BEFORE THE MEDIA QUERY THAT TURNS IT ON. A media query outranks
   nothing — at equal specificity source order decides — so this block sitting
   after it meant `display:none` won at every width and the bar never appeared.
   That is the same cascade defect the post-redesign review catalogued four
   times over; it is easy to write and invisible until something is measured. */
.ed-mtabs{display:none;flex:none;border-top:1px solid #DDE3ED;background:#1E2D4A;}
.ed-mtabs button{flex:1;min-height:52px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;font:600 11.5px/1.2 'Source Sans 3';color:#C4CEDF;
  border-top:3px solid transparent;}
.ed-mtabs button[aria-selected="true"]{color:#FBF8F3;border-top-color:#C9973A;background:rgba(255,255,255,.06);}
.ed-mtabs i{font-style:normal;font-size:15px;line-height:1;}

/* ── THE PHONE ────────────────────────────────────────────────────────────────
   Below 900px the four columns cannot be columns: 224 + 266 + canvas + 318 into
   390px is not a layout, it is four things fighting. So exactly ONE surface is
   on screen at a time and a bar along the bottom switches between them — the
   only new interaction in the whole change.

   ⚠ NOTHING ELSE ABOUT THE EDITOR CHANGES, and that is the point. Every drag in
   here already has a tap equivalent, because they were built as keyboard
   equivalents: a palette chip ADDS on click, a block moves with the arrows in
   its toolbar, a row moves with the arrows beside it, a picture is chosen from
   the library. Touch inherits all of it. What was missing was somewhere to
   stand. */
@media(max-width:900px){
  /* The bar is the one piece of chrome that appears rather than moves. */
  .ed-mtabs{display:flex;}
  .ed-body{padding-bottom:0;}

  /* Every surface becomes the whole body, and only the chosen one is drawn.
     ⚠ `.ed-pages` has to come back OUT of the absolute positioning the 1240px
     rule gives it, or the page list would float over whatever is showing. */
  .ed-pages,.ed-rail,.ed-mid,.ed-insp{
    display:none;position:static;width:auto;flex:1 1 auto;min-width:0;
    border-left:0;border-right:0;box-shadow:none;}
  .ed--m-pages  .ed-pages{display:flex;}
  .ed--m-blocks .ed-rail{display:flex;}
  .ed--m-canvas .ed-mid{display:flex;}
  .ed--m-insp   .ed-insp{display:flex;}

  /* ⚠ A collapsed rail is a 26px spine, which as a whole surface is a blank
     column with nothing in it. The collapse is a desktop idea — there is no
     canvas beside it here to make room for — so it is switched off rather than
     honored, and the stored choice is left alone for when they are back at a
     desk. The toggles go with it: they now hide the only thing on screen. */
  .ed-pages--shut,.ed-rail--shut{width:auto;}
  .ed-pages--shut .ed-pages-search,.ed-pages--shut .ed-pages-list,.ed-pages--shut .ed-pages-f,
  .ed-rail--shut .ed-rail-list,.ed-rail--shut .ed-rail-f{display:flex;}
  #edPagesToggle,#edRailToggle{display:none;}

  /* The paper is the phone. See fitPaper(): no fixed width and no zoom, so the
     canvas is 1:1 and the caret lands where it is tapped. */
  .ed-canvas{padding:10px 10px 18px;}
  .ed-paper{border-radius:0;box-shadow:none;padding:0;}

  /* Choosing a preview width on a phone is choosing between 390 and 390. */
  .ed-devices{display:none;}
  .ed-crumb,.ed-saved{display:none;}
  .ed-top{gap:8px;padding:0 10px;}

  /* Tap targets. 44px on everything somebody aims at — the same rule the public
     site was measured against, applied to the editor at last.
     ⚠ The rail row keeps its own height rather than a min-height: it is a flex
     row and a min-height would leave the label floating at the top of it. */
  .ed-rail-list [data-index],.ed-pages-list a,.ed-pages-list button{min-height:44px;}
  .ed-move,.ed-item-h button,.ed-pal-toggle,.ed-tabs button,.ed-add{min-height:44px;min-width:44px;}
  .ed-grip{padding:12px 8px;margin:-12px -8px;}
  .ed-chip{min-height:44px;}
  /* The palette is half the screen if it keeps its desktop height. */
  .ed-pal-chips{max-height:38vh;overflow:auto;}
}

</style>

<body>
<div id="root"><div class="ed-boot">Loading the page editor…</div></div>
<div class="ed-sr" role="status" aria-live="polite" id="live"></div>
<script>
/* ── WHETHER A LINK GOES ANYWHERE ────────────────────────────────────────
   Injected from admin/links.js, which is also what the Worker checks links
   with — one definition, two runtimes, and a test that runs the same cases
   against both so they cannot drift. Defines tlcNormalizePath, tlcLinkKind,
   tlcResolveLink, tlcLinkWarning and tlcPickerGroups. */
/*TLCB_LINKS_JS*/
/* ── Ministry page editor ─────────────────────────────────────────────────
   Owns the rail, canvas, palette and inspector. It does NOT own the block
   templates: the canvas HTML is rendered by the Worker from admin/blocks.js,
   the same module the public page renders through. Structural changes (add,
   delete, duplicate, reorder, undo, reset) ask the Worker to re-render;
   everything the inspector adjusts is a CSS custom property applied straight
   to the block node, so spacing/color/size changes are instant and cannot
   drift from what the public page will do with the same value. */
(function () {
'use strict';

// The same editor serves two things: a ministry page (youth_pages, addressed by
// slug) and a site page (the pages table, addressed by id). Only the API prefix
// and the identifier differ, so they are picked up from the address once here
// rather than forking the editor.
var PAGE_MATCH = location.pathname.match(/^\/pages\/([^/?#]+)\/edit/);
var IS_SITE_PAGE = !!PAGE_MATCH;
var API = IS_SITE_PAGE ? '/pages/api' : '/ministries/api';
var BACK_HREF = IS_SITE_PAGE ? '/pages' : '/ministries';
var BACK_LABEL = IS_SITE_PAGE ? 'Pages' : 'Ministries';
var SLUG = decodeURIComponent(PAGE_MATCH ? PAGE_MATCH[1]
  : ((location.pathname.match(/\/ministries\/editor\/([^/?#]+)/) || [])[1] || ''));
var WIDTHS = { desktop: 900, tablet: 620, phone: 390 };
var HINT_KEY = 'tlc-ministry-editor-hint-v1';

var S = {
  // `slug` identifies the page to the API; `path` is where it lives on the
  // public site. For a ministry page they are the same word; for a site page
  // the id and the address are separate things.
  slug: SLUG, path: '/' + SLUG, title: '', status: 'live', updatedAt: '',
  blocks: [], config: null, media: [],
  // The opening palette group is whatever the config lists first, not a name
  // written here — a hardcoded 'Content' silently outlived a reorder of
  // GROUPS, and the palette opened on the second group.
  selectedId: null, device: 'desktop', group: null, paletteOpen: true,
  // Which surface the phone is showing. Ignored above the breakpoint.
  mobileView: 'canvas',
  // ⚠ TWO STACKS, AND `future` IS CLEARED BY EVERY NEW EDIT — see pushHistory.
  // Without that, undoing three steps and then typing something leaves a redo
  // stack describing a branch that was just abandoned, and pressing Redo
  // assembles a page that never existed.
  changes: [], history: [], future: [], saved: null, dirty: false,
  dragId: null, dragType: null, dragSection: null, dropIndex: null,
  // A drag INSIDE the inspector — one of a block's own rows moving within its
  // own array. Kept apart from dragId above, which moves a whole block between
  // positions, pages and half-width pairs; sharing one field would let a
  // half-finished row drag be completed as a block drop.
  rowDrag: null,
  // True from a structural change until the Worker's redraw lands: what is on
  // the canvas describes the blocks as they were, so nothing may be committed
  // from it. See commitField.
  canvasStale: false,
  // Every address on this site that answers — pages, their short links, and
  // redirects. Filled from the editor's boot payload; an empty list simply
  // means no picker and no check, never a broken screen.
  linkTargets: [],
  picker: null, toast: null, hint: true, loadError: '',
  publishPanel: false, publishAt: null, publishAtLocal: '', revisions: [], sections: [],
  template: '', siblings: [], railOpen: true, blocksOpen: true, leaving: false, tab: 'block',
  role: 'office', editors: [],
  pageMeta: null, savingPage: false,
};

var el = {};
var toastTimer = null;

// ── small helpers ──────────────────────────────────────────────────────────
function esc(s) {
  return (s == null ? '' : String(s)).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function def(type) { return (S.config && S.config.types[type]) || { label: 'Block', glyph: '▣' }; }
function findBlock(id) { for (var i = 0; i < S.blocks.length; i++) if (S.blocks[i].id === id) return S.blocks[i]; return null; }
function indexOfBlock(id) { for (var i = 0; i < S.blocks.length; i++) if (S.blocks[i].id === id) return i; return -1; }
function now() { return new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
function say(msg) { el.live.textContent = msg; }

async function api(path, opts) {
  var res = await fetch(path, Object.assign({ headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin' }, opts || {}));
  if (res.status === 401 || res.status === 403) { location.href = '/login'; throw new Error('auth'); }
  if (!res.ok) throw new Error((await res.text().catch(function () { return ''; })) || ('Request failed (' + res.status + ')'));
  return res.json();
}

function toast(msg) {
  S.toast = msg;
  renderToast();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { S.toast = null; renderToast(); }, 2600);
}

// ── shell ──────────────────────────────────────────────────────────────────
function shellHtml() {
  return '' +
  '<div class="ed">' +
    '<header class="ed-top">' +
      '<div class="ed-brand"><div class="ed-mark" aria-hidden="true">T</div><span>Timothy Admin</span></div>' +
      '<nav class="ed-crumb" aria-label="Breadcrumb"><a href="' + BACK_HREF + '">' + BACK_LABEL + '</a><i>/</i><b id="edTitle"></b></nav>' +
      '<span class="ed-pill" id="edPill"></span>' +
      '<span class="ed-saved" id="edSaved"></span>' +
      '<div class="ed-spacer"></div>' +
      '<a class="ed-view" id="edView" target="_blank" rel="noopener">View live</a>' +
      '<div class="ed-devices" role="group" aria-label="Preview width">' +
        '<button type="button" data-device="desktop">Desktop</button>' +
        '<button type="button" data-device="tablet">Tablet</button>' +
        '<button type="button" data-device="phone">Phone</button>' +
      '</div>' +
      '<button type="button" class="ed-undo" id="edUndo">↺ Undo</button>' +
      '<button type="button" class="ed-undo" id="edRedo">↻ Redo</button>' +
      '<span style="display:flex;gap:1px">' +
        '<button type="button" class="ed-publish" id="edPublish">Publish</button>' +
        '<button type="button" class="ed-publish ed-publish-more" id="edMore" aria-haspopup="dialog" aria-expanded="false" aria-label="Publishing options">▾</button>' +
      '</span>' +
    '</header>' +
    '<div class="ed-hint" id="edHint">' +
      '<b>Try it:</b><span>drag rows in the left rail to reorder · drag a block from the bottom panel onto the page · click any text to type · use the right panel for spacing and layout</span>' +
      '<button type="button" id="edHintX" aria-label="Dismiss tip">×</button>' +
    '</div>' +
    '<div class="ed-body">' +
      (IS_SITE_PAGE ?
      '<aside class="ed-pages" id="edPages">' +
        '<div class="ed-pages-h"><span>Site pages</span>' +
          '<button type="button" id="edPagesToggle" aria-expanded="true" aria-label="Hide the page list">‹</button></div>' +
        '<input class="ed-pages-search" id="edPagesSearch" type="search" placeholder="Search pages…" aria-label="Search pages">' +
        '<div class="ed-pages-list" id="edPagesList"></div>' +
        '<div class="ed-pages-f">' +
          '<a href="/pages">All pages &amp; menu</a>' +
          '<button type="button" id="edPagesNew">+ New page</button>' +
        '</div>' +
      '</aside>' : '') +
      '<aside class="ed-rail" id="edBlockRail">' +
        '<div class="ed-rail-h" id="edRailHead"><span>Page blocks</span>' +
          '<button type="button" id="edRailToggle" aria-expanded="true" aria-label="Hide the block list">\u2039</button></div>' +
        '<div class="ed-rail-list" id="edRail" role="listbox" aria-labelledby="edRailHead" tabindex="-1"></div>' +
        '<div class="ed-rail-f">Drag to reorder · Alt + ↑ ↓ with a row focused</div>' +
      '</aside>' +
      '<main class="ed-mid">' +
        '<div class="ed-canvas" id="edCanvas"><div class="ed-paper" id="edPaper"></div></div>' +
        '<div class="ed-pal">' +
          '<div class="ed-pal-h">' +
            '<div class="ed-pal-scroll"><span class="ed-pal-label">Add block</span><span id="edPalTabs" style="display:flex;gap:4px"></span></div>' +
            '<button type="button" class="ed-pal-toggle" id="edPalToggle"></button>' +
          '</div>' +
          '<div class="ed-pal-chips" id="edPalChips"></div>' +
        '</div>' +
      '</main>' +
      '<aside class="ed-insp">' +
        (IS_SITE_PAGE ?
        '<div class="ed-tabs" role="tablist" aria-label="Inspector">' +
          '<button type="button" role="tab" data-tab="block" id="edTabBlock" aria-selected="true">Block</button>' +
          '<button type="button" role="tab" data-tab="page" id="edTabPage" aria-selected="false">Page</button>' +
        '</div>' : '') +
        '<div id="edInspHead"></div>' +
        '<div id="edInspBody" class="ed-insp-body"></div>' +
        '<div class="ed-changes">' +
          '<span class="ed-lab" id="edChangesHead">Unpublished changes</span>' +
          '<ul id="edChanges"></ul>' +
        '</div>' +
      '</aside>' +
    '</div>' +
    // The phone's whole navigation. Rendered always and shown only below the
    // breakpoint, because a bar that appears on resize is one that has to be
    // built twice — once here and once in a resize handler.
    '<nav class="ed-mtabs" id="edMTabs" role="tablist" aria-label="Editor sections">' +
      (IS_SITE_PAGE ? '<button type="button" role="tab" data-m="pages" aria-selected="false"><i aria-hidden="true">\u2630</i>Pages</button>' : '') +
      '<button type="button" role="tab" data-m="blocks" aria-selected="false"><i aria-hidden="true">\u2637</i>Blocks</button>' +
      '<button type="button" role="tab" data-m="canvas" aria-selected="true"><i aria-hidden="true">\u25A4</i>Page</button>' +
      '<button type="button" role="tab" data-m="insp" aria-selected="false"><i aria-hidden="true">\u2699</i>Settings</button>' +
    '</nav>' +
  '</div>' +
  '<div id="edPublishPanel"></div>' +
  '<div id="edModal"></div>' +
  '<div id="edToast"></div>';
}

function cacheEls() {
  ['edTitle', 'edPill', 'edSaved', 'edView', 'edUndo', 'edRedo', 'edPublish', 'edHint', 'edHintX', 'edRail',
   'edCanvas', 'edPaper', 'edPalTabs', 'edPalChips', 'edPalToggle', 'edInspHead', 'edInspBody',
   'edMTabs',
   'edChanges', 'edChangesHead', 'edModal', 'edToast', 'edMore', 'edPublishPanel',
   'edPages', 'edPagesList', 'edPagesSearch', 'edPagesToggle', 'edPagesNew',
   'edBlockRail', 'edRailToggle',
   'edTabBlock', 'edTabPage'].forEach(function (id) { el[id] = document.getElementById(id); });
  el.live = document.getElementById('live');
}

// ── canvas sizing ──────────────────────────────────────────────────────────
// The paper keeps its true pixel width and is scaled to fit with `zoom`.
// `transform: scale()` is wrong here: it does not affect the layout box, so a
// centered scaled paper drifts out of view. The paper must not flex-shrink
// either, or the device switcher looks like it does nothing.
// The breakpoint, in one place, so the CSS and the script cannot disagree about
// what counts as a phone.
var NARROW = 900;
function isNarrow() { return window.innerWidth <= NARROW; }

function fitPaper() {
  // ⚠ ON A PHONE THE PAPER IS THE PHONE. Fixed at 390 inside a ~370px canvas,
  // fitPaper's own arithmetic would scale it to about 0.8 — and `zoom` and
  // caret hit-testing do not agree in every engine, so text would land where it
  // was not tapped. Fluid width with no zoom means the canvas is 1:1 and it is
  // rendering at the real device width, which is also exactly what the visitor
  // will see. The class still goes on, so the block phone rules apply.
  if (isNarrow()) {
    el.edPaper.style.width = '';
    el.edPaper.style.zoom = '';
    el.edPaper.classList.add('ed-paper--phone');
    return;
  }
  var w = WIDTHS[S.device] || WIDTHS.desktop;
  el.edPaper.style.width = w + 'px';
  el.edPaper.classList.toggle('ed-paper--phone', S.device === 'phone');
  var avail = el.edCanvas.clientWidth - 56;
  el.edPaper.style.zoom = avail > 0 ? Math.min(1, avail / w) : 1;
}

// Which of the four surfaces the phone is showing. One class on the root and
// the CSS does the rest — nothing is moved in the DOM, so a resize back to a
// desktop restores the four columns with no rebuild and nothing lost.
var MOBILE_VIEWS = ['pages', 'blocks', 'canvas', 'insp'];
function setMobileView(key) {
  if (MOBILE_VIEWS.indexOf(key) === -1) key = 'canvas';
  S.mobileView = key;
  var root = document.querySelector('.ed');
  if (root) {
    MOBILE_VIEWS.forEach(function (k) { root.classList.toggle('ed--m-' + k, k === key); });
  }
  if (el.edMTabs) {
    var btns = el.edMTabs.querySelectorAll('[data-m]');
    for (var i = 0; i < btns.length; i++) {
      btns[i].setAttribute('aria-selected', String(btns[i].dataset.m === key));
    }
  }
  // The canvas has a different width in each of these, and the paper follows it.
  fitPaper();
}

function setDevice(d) {
  S.device = d;
  var btns = el.edCanvas.ownerDocument.querySelectorAll('.ed-devices button');
  for (var i = 0; i < btns.length; i++) btns[i].setAttribute('aria-pressed', String(btns[i].dataset.device === d));
  fitPaper();
  say(d === 'phone' ? 'Phone preview' : d === 'tablet' ? 'Tablet preview' : 'Desktop preview');
}

// ── rendering ──────────────────────────────────────────────────────────────
function renderTop() {
  el.edTitle.textContent = S.title || S.slug;
  document.title = (S.title || S.slug) + ' — page editor';
  var n = S.changes.length;
  var scheduled = S.status === 'scheduled' && S.publishAt;
  el.edPill.className = 'ed-pill ' + (scheduled || n ? 'ed-pill--draft' : 'ed-pill--live');
  el.edPill.textContent = scheduled ? 'Scheduled · ' + fmtWhen(S.publishAt)
    : n ? 'Draft · ' + n + ' edit' + (n === 1 ? '' : 's')
    : (S.status === 'live' ? 'Published' : 'Draft');
  el.edSaved.textContent = S.saved ? 'Autosaved ' + S.saved : 'No changes yet';
  el.edUndo.disabled = S.history.length === 0;
  // Disabled rather than hidden: a control that vanishes and reappears is
  // one the eye has to re-find, and an empty redo stack is the normal state.
  el.edRedo.disabled = S.future.length === 0;
  el.edPublish.disabled = false;
  el.edView.href = 'https://timothystl.org' + S.path;
}

// Which row (top/bottom of a pair) each half belongs to, walked the same way
// pairHalves() walks the list: two consecutive halves make a row, a third
// starts a new one — so the rail cannot bracket a grouping the page does not
// draw. Rows are always exactly one or two blocks, so there is no "middle" of
// a row to mark, only its top and bottom half.
function runEdges(i) {
  var b = S.blocks[i];
  if (!b || b.width !== 'half') return '';
  // Find the start of this half-run, then count pairs of two off from there
  // to know whether i is the top or bottom half of its own row.
  var runStart = i;
  while (runStart > 0 && S.blocks[runStart - 1] && S.blocks[runStart - 1].width === 'half') runStart -= 1;
  var posInRow = (i - runStart) % 2;
  var partner = posInRow === 0 ? S.blocks[i + 1] : S.blocks[i - 1];
  if (!partner || partner.width !== 'half') return '';   // a lone half brackets nothing
  return posInRow === 0 ? ' ed-row--run-top' : ' ed-row--run-bottom';
}

function renderRail() {
  var html = '';
  for (var i = 0; i < S.blocks.length; i++) {
    var b = S.blocks[i];
    var d = def(b.type);
    if (S.dropIndex === i) html += '<div class="ed-drop" aria-hidden="true"></div>';
    // A paired row is bracketed down the left edge, so the pairing is visible
    // here without going to the canvas. The pair is computed the same way the
    // renderer computes it — two consecutive halves, a third starting a new
    // row — so the rail cannot claim a pairing the page does not draw.
    var pairCls = runEdges(i);
    html += '<button type="button" role="option" class="ed-row' + pairCls + (b.hidden ? ' is-hidden' : '') + (S.dragId === b.id ? ' is-dragging' : '') + '"' +
      ' draggable="true" data-id="' + esc(b.id) + '" data-index="' + i + '"' +
      ' aria-selected="' + (b.id === S.selectedId) + '"' +
      ' aria-label="' + esc(d.label) + ' block, position ' + (i + 1) + ' of ' + S.blocks.length +
        (b.hidden ? ', hidden on phone' : '') + (b.locked ? ', set by the church office' : '') + '">' +
      '<span class="ed-row-grip" aria-hidden="true">⠿</span>' +
      '<span class="ed-row-glyph" aria-hidden="true">' + esc(d.glyph) + '</span>' +
      '<span class="ed-row-label">' + esc(rowLabel(b, d)) + '</span>' +
      (b.locked ? '<span class="ed-row-tag" title="Set by the church office">\uD83D\uDD12</span>' : '') +
      (b.hidden ? '<span class="ed-row-tag">Hidden</span>' : '') +
      '</button>';
  }
  if (S.dropIndex === S.blocks.length && (S.dragId || S.dragType)) html += '<div class="ed-drop" aria-hidden="true"></div>';
  if (!S.blocks.length) html += '<div class="ed-rail-empty">No blocks yet.<br>Drag one from below.</div>';
  el.edRail.innerHTML = html;
}

// The rail is more useful when a row says which block it is, not just its type.
function rowLabel(b, d) {
  var own = (b.title || '').trim() || (b.type === 'text' ? stripTags(b.body).slice(0, 32) : '');
  return own ? d.label + ' · ' + own : d.label;
}
function stripTags(s) { return (s || '').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim(); }

// The four groups come from the block definitions; "Saved" is added here
// because its contents are whatever this church has saved, not a fixed list.
function paletteGroups() {
  return S.config.groups.concat([{ name: 'Saved', types: [] }]);
}

function renderPalette() {
  var tabs = '';
  var groups = paletteGroups();
  // Null means "whatever comes first" — resolved here rather than at start-up
  // so it is still right if the config is reordered.
  if (!S.group && groups.length) S.group = groups[0].name;
  groups.forEach(function (g) {
    tabs += '<button type="button" class="ed-pal-tab" data-group="' + esc(g.name) + '" aria-pressed="' + (g.name === S.group) + '">' + esc(g.name) + '</button>';
  });
  el.edPalTabs.innerHTML = tabs;
  el.edPalToggle.textContent = S.paletteOpen ? 'Hide' : 'Show blocks';
  el.edPalToggle.setAttribute('aria-expanded', String(S.paletteOpen));
  el.edPalChips.style.display = S.paletteOpen ? '' : 'none';
  var chips = '';
  if (S.group === 'Saved') {
    if (!S.sections.length) {
      chips = '<span class="ed-note" style="color:#93A2B8;padding:4px 2px">Nothing saved yet. Select a block and choose ' +
        '&ldquo;Save as reusable section&rdquo; to keep it for other pages.</span>';
    } else {
      S.sections.forEach(function (sec) {
        chips += '<span class="ed-chip ed-chip--saved" draggable="true" data-section="' + sec.id + '">' +
          '◇&nbsp;&nbsp;' + esc(sec.name) +
          '<span class="ed-chip-n">' + sec.count + '</span>' +
          '<button type="button" class="ed-chip-x" data-del-section="' + sec.id + '" aria-label="Delete the saved section ' + esc(sec.name) + '">×</button>' +
          '</span>';
      });
    }
  } else {
    var group = null;
    S.config.groups.forEach(function (g) { if (g.name === S.group) group = g; });
    (group ? group.types : []).forEach(function (t) {
      var d = def(t);
      chips += '<button type="button" class="ed-chip" draggable="true" data-type="' + esc(t) + '">' +
        esc(d.glyph) + '&nbsp;&nbsp;' + esc(d.label) + '</button>';
    });
  }
  el.edPalChips.innerHTML = chips;
}

// ── saved sections ─────────────────────────────────────────────────────────
async function loadSections() {
  try {
    var out = await api(API + '/sections');
    S.sections = out.sections || [];
    if (S.group === 'Saved') renderPalette();
  } catch (_) { /* the rest of the palette still works */ }
}

async function saveSection(blocks, suggested) {
  if (!blocks.length) return toast('There is nothing to save');
  var name = window.prompt('Name this section so you can find it again:', suggested || '');
  if (name === null) return;
  name = name.trim();
  if (!name) return toast('A section needs a name');
  try {
    await api(API + '/sections', { method: 'POST', body: JSON.stringify({ name: name, blocks: blocks }) });
    await loadSections();
    toast('Saved — find it under "Saved" in the panel below');
    say('Section saved');
  } catch (err) {
    toast(err.message || 'Could not save that section');
  }
}

async function insertSection(id, at) {
  var out = await api(API + '/sections/' + Number(id));
  var blocks = out.blocks || [];
  if (!blocks.length) return;
  pushHistory();
  var args = [at, 0].concat(blocks);
  Array.prototype.splice.apply(S.blocks, args);
  S.selectedId = blocks[0].id;
  var sec = S.sections.filter(function (x) { return x.id === Number(id); })[0];
  note('Added ' + (sec ? sec.name : 'a saved section'));
  await rerender();
  renderTop(); renderRail(); renderChanges(); scheduleSave();
  say((sec ? sec.name : 'Section') + ' added — ' + blocks.length + ' block' + (blocks.length === 1 ? '' : 's'));
}

async function deleteSection(id) {
  var sec = S.sections.filter(function (x) { return x.id === Number(id); })[0];
  if (!window.confirm('Delete the saved section "' + (sec ? sec.name : '') + '"? Pages already using it keep their blocks.')) return;
  try {
    await api(API + '/sections/' + Number(id) + '/delete', { method: 'POST', body: '{}' });
    await loadSections();
    toast('Saved section deleted');
  } catch (err) { toast(err.message || 'Could not delete that'); }
}

function renderChanges() {
  el.edChangesHead.textContent = S.changes.length ? 'Unpublished changes (' + S.changes.length + ')' : 'Unpublished changes';
  el.edChanges.innerHTML = S.changes.length
    ? S.changes.map(function (c) { return '<li>' + esc(c) + '</li>'; }).join('')
    : '<li class="ed-none-yet">Nothing since the last publish.</li>';
}

function renderToast() {
  el.edToast.innerHTML = S.toast ? '<div class="ed-toast" role="status">' + esc(S.toast) + '</div>' : '';
}

// Canvas markup always comes from the Worker.
async function refreshCanvas() {
  var out = await api(API + '/render', { method: 'POST', body: JSON.stringify({ blocks: S.blocks, slug: S.slug }) });
  setCanvas(out.html);
}

function setCanvas(html) {
  if (window.tinymce) { try { window.tinymce.remove(); } catch (_) {} }
  el.edPaper.innerHTML = html;
  // The screen describes the blocks again, so a field on it may be committed
  // from once more.
  S.canvasStale = false;
  // A page whose blocks lead with a hero owns the whole page on the public
  // site, and the canvas has to preview it the same way or the WYSIWYG lies.
  var pageDiv = el.edPaper.querySelector('.tlcb-page');
  if (pageDiv) pageDiv.classList.toggle('tlcb-page--full', !!(S.blocks[0] && S.blocks[0].type === 'hero'));
  applySelection();
  fitPaper();
}

// Rich text uses the same TinyMCE the office already knows, in inline mode: a
// floating toolbar on selection rather than a second editor chrome inside the
// page. The toolbar carries no font, size or color controls — those live in
// the inspector where they are constrained to the site's own scale and palette.
// If TinyMCE fails to load the fields stay plain contenteditable, which still
// types and still saves — and that fallback is what makes the rest of this safe.
//
// ⚠ ONE FIELD AT A TIME, ON FOCUS. This used to init every [data-rich="1"] on
// the canvas at once, and setCanvas() runs again on every add, delete,
// duplicate, reorder, alignment click and undo — so a page with fourteen rich
// fields (/ministries has exactly that) built and tore down fourteen editors
// per structural change. Against the old cloud account that was fourteen
// BILLED editor loads; self-hosted it is merely fourteen editors' worth of work
// on every nudge, which is still the wrong thing to do. Now the only thing that
// creates an editor is somebody putting the caret in a field.
function openRichField(node) {
  if (!node || !node.dataset || node.dataset.rich !== '1') return;
  // TinyMCE marks the element it has taken over. Re-initializing a live editor
  // would detach the toolbar.
  if (node.classList.contains('mce-content-body')) return;
  if (typeof window._onTinymce !== 'function') return;
  // ⚠ Where the caret is. The browser has already put it where the person
  // clicked; TinyMCE's own focus() has no bookmark to restore on a brand-new
  // editor and sends it to the start of the field. Clicking into the middle of
  // a paragraph and typing at the beginning of it is the kind of small wrong
  // thing nobody reports and everybody works around, so the range is taken
  // before init and put back after. Inline mode edits the element in place, so
  // it is usually still valid; if it is not, setRng throws and the caret simply
  // stays where focus left it.
  var saved = null;
  try {
    var sel = window.getSelection();
    if (sel && sel.rangeCount && node.contains(sel.anchorNode)) saved = sel.getRangeAt(0).cloneRange();
  } catch (_) { /* no selection to keep */ }
  window._onTinymce(function () {
    if (!window.tinymce) return;
    // The canvas may have been redrawn while the library was still arriving.
    if (!el.edPaper.contains(node) || node.classList.contains('mce-content-body')) return;
    try {
      window.tinymce.init({
        target: node,
        // Self-hosted, not cloud — see TINYMCE_HEAD in admin/db.js. Every
        // plugin named below must exist in admin/vendor/tinymce/plugins.
        base_url: '/assets/tinymce/7.9.3',
        suffix: '.min',
        license_key: 'gpl',
        inline: true, menubar: false, statusbar: false, branding: false,
        plugins: 'lists link autolink',
        // The headings dropdown is first because it is the one control that
        // changes the SHAPE of what is written rather than the weight of a few
        // words — "a heading, then the text under it" was not expressible here
        // at all before, even though h2/h3/h4 have always been allowed through
        // the sanitizer and have always had styles in BLOCK_CSS.
        //
        // ⚠ The three names are the site's own hierarchy, not TinyMCE's H1–H6.
        // A block already draws its own title as the page's heading, so a rich
        // field's h2 is a heading WITHIN that section — offering H1 would put a
        // second page title in the middle of a page.
        toolbar: 'blocks | bold italic underline | bullist numlist | link',
        block_formats: 'Text=p;Heading=h2;Subheading=h3;Small heading=h4',
        valid_elements: 'p,br,strong/b,em/i,u,s,ul,ol,li,a[href|target|rel],h2,h3,h4,blockquote',
        link_default_target: '_blank',
        setup: function (ed) {
          ed.on('blur', function () { commitField(ed.getElement()); });
        },
        init_instance_callback: function (ed) {
          ed.focus();
          if (saved) { try { ed.selection.setRng(saved); } catch (_) {} }
        },
      });
    } catch (_) { /* plain contenteditable is a fine fallback */ }
  });
}

function applySelection() {
  var nodes = el.edPaper.querySelectorAll('.tlcb');
  for (var i = 0; i < nodes.length; i++) nodes[i].classList.toggle('is-sel', nodes[i].dataset.id === S.selectedId);
}

// The pages rail: every page on the site, in menu order, children indented.
// A gold dot marks a page with unpublished changes and "hidden" marks one that
// is not in the menu — the same two facts the All pages list shows, so the two
// screens cannot tell staff different things.
function renderPagesRail() {
  if (!el.edPagesList) return;
  var q = (el.edPagesSearch && el.edPagesSearch.value || '').trim().toLowerCase();
  var all = S.siblings || [];
  var hit = function (p) { return !q || (p.title + ' ' + p.slug).toLowerCase().indexOf(q) > -1; };
  var row = function (p, child) {
    var here = p.id === S.slug;
    return '<button type="button" class="ed-page' + (child ? ' ed-page--child' : '') + (here ? ' is-here' : '') +
      '" data-page="' + esc(p.id) + '"' + (here ? ' aria-current="page"' : '') + '>' +
      (p.slug === '/' ? '<span class="ed-page-tag" title="Homepage">\u2302</span>' : '') +
      '<span class="ed-page-t">' + esc(p.title) + '</span>' +
      (p.hasDraftEdits ? '<span class="ed-page-dot" title="Unpublished changes"></span>' : '') +
      (p.in_menu ? '' : '<span class="ed-page-tag">hidden</span>') +
      '</button>';
  };
  var html = '';
  all.filter(function (p) { return !p.parent_id; }).forEach(function (p) {
    var kids = all.filter(function (c) { return c.parent_id === p.id; });
    // A parent stays visible when one of its children matches, or searching
    // would strand the child with nothing to sit under.
    if (!hit(p) && !kids.some(hit)) return;
    html += row(p, false);
    kids.filter(hit).forEach(function (c) { html += row(c, true); });
  });
  el.edPagesList.innerHTML = html || '<div class="ed-pages-none">No pages match that.</div>';
}

function renderAll() {
  renderTop();
  renderPagesRail();
  renderRail();
  renderPalette();
  renderChanges();
  renderInspector();
}

// ── mutation ───────────────────────────────────────────────────────────────
// Every change goes through patch(). `mode` decides how the canvas catches up:
//   'style'    — the block's CSS custom properties are updated in place (default)
//   'rerender' — the markup itself changed, so ask the Worker to redraw
//   'none'     — the DOM is already correct (the user just typed into it)
function pushHistory() {
  S.history.push(JSON.stringify(S.blocks));
  if (S.history.length > 40) S.history.shift();
  // ⚠ A NEW EDIT ABANDONS THE REDO BRANCH, and this line is the whole
  // correctness of redo. Undo three steps, type something, press Redo: without
  // this you get a page assembled from a branch that no longer exists, which
  // looks like the editor inventing content.
  S.future.length = 0;
}
function note(text) {
  if (!text) return;
  S.changes.unshift(text + ' · ' + now());
  if (S.changes.length > 24) S.changes.length = 24;
}

function patch(id, part, label, mode, keepInspector) {
  var b = findBlock(id);
  if (!b) return;
  pushHistory();
  Object.keys(part).forEach(function (k) { b[k] = part[k]; });
  note(label);
  // From here until the Worker's redraw lands, what is on screen describes the
  // blocks as they WERE. See commitField, which must not write from it.
  if (mode === 'rerender') { S.canvasStale = true; rerender(); } else if (mode !== 'none') { restyle(b); }
  renderTop(); renderRail(); renderChanges();
  if (!keepInspector) renderInspector();
  scheduleSave();
  if (label) say(label);
}

// The client half of the CSS-custom-property contract in admin/blocks.js.
// It must produce byte-identical output to wrapperVars() there — test/
// editor.test.mjs asserts exactly that against a server render, so drift is
// caught rather than shipped.
function styleVars(b) {
  var C = S.config;
  var sz = C.SIZES.filter(function (x) { return x.key === b.size; })[0] || C.SIZES[1];
  var sp = C.SPLITS.filter(function (x) { return x.key === b.split; })[0] || C.SPLITS[1];
  var bg = C.BG[b.bg] || C.BG[0];
  var ink = C.INK[b.ink] || C.INK[0];
  var cols = b.side === 'above' ? '1fr' : (b.side === 'right' ? sp.b + ' ' + sp.a : sp.a + ' ' + sp.b);
  var v = [
    '--tlcb-bg:' + (bg.grad || bg.c),
    '--tlcb-bg-flat:' + bg.c,
    '--tlcb-ink:' + ink.c,
    // ⚠ Must stay byte-identical to wrapperVars() in admin/blocks.js — the
    // editor patches these onto the node directly instead of re-rendering, so
    // a difference here is a canvas that disagrees with the published page.
    // test/editor-edit.test.mjs asserts it.
    '--tlcb-head-ink:' + (bg.head || (bg.dark ? '#F3EDE1' : '#1E2D4A')),
    '--tlcb-eyebrow-ink:' + (bg.eyebrow || '#C9973A'),
    '--tlcb-link-ink:' + (bg.link || '#2E7EA6'),
    '--tlcb-rule:' + (bg.rule || (bg.dark ? 'rgba(245,240,230,.14)' : '#E7DFD1')),
    '--tlcb-chip-bg:' + (bg.chip || 'rgba(0,0,0,.04)'),
    // ⚠ Byte-identical to wrapperVars() in admin/blocks.js — test/editor.test.mjs
    // asserts exactly that against a server render. The scale itself lives on
    // the page wrapper, not here, so the canvas follows the Appearance screen
    // the same way the public page does.
    '--tlcb-body:calc(' + sz.body + 'px * var(--tlcb-scale, 1))',
    '--tlcb-head:calc(' + sz.head + 'px * var(--tlcb-head-scale, 1))',
    '--tlcb-hero:calc(' + sz.hero + 'px * var(--tlcb-head-scale, 1))',
    '--tlcb-gap:' + b.gap + 'px',
    '--tlcb-height:' + b.height + 'px',
    '--tlcb-media-order:' + (b.side === 'right' ? 2 : 0),
    '--tlcb-space-above:' + b.spaceAbove + 'px',
    '--tlcb-space-below:' + b.spaceBelow + 'px',
  ];
  if (b.type === 'textphoto') v.push('--tlcb-cols:' + cols);
  if (b.type === 'columns') v.push('--tlcb-cols:repeat(' + b.cols + ',1fr)');
  if (b.type === 'cardgrid') v.push('--tlcb-cols:repeat(' + b.cols + ',1fr)');
  if (b.type === 'hero' && b.photo) v.push("--tlcb-hero-img:url('" + String(b.photo).replace(/["'\\()\s<>;{}]/g, '') + "')");
  return v.join(';');
}

function blockNode(id) {
  var nodes = el.edPaper.querySelectorAll('.tlcb');
  for (var i = 0; i < nodes.length; i++) if (nodes[i].dataset.id === id) return nodes[i];
  return null;
}

function restyle(b) {
  var node = blockNode(b.id);
  if (!node) return;
  node.setAttribute('style', styleVars(b));
  node.classList.toggle('tlcb-hide-phone', !!b.hidden);
  node.classList.toggle('is-sel', b.id === S.selectedId);
  if (b.type === 'spacer') {
    var sp = node.querySelector('.tlcb-spacer');
    if (sp) sp.textContent = b.height + 'PX SPACE';
  }
}

// Redraws are serialized. Clicking two things quickly starts two round trips,
// and without this the slower one can land last and repaint the canvas from a
// state that has already been superseded.
var renderChain = Promise.resolve();
function rerender() {
  renderChain = renderChain.then(doRerender, doRerender);
  return renderChain;
}
async function doRerender() {
  try {
    var out = await api(API + '/render', { method: 'POST', body: JSON.stringify({ blocks: S.blocks, slug: S.slug }) });
    S.blocks = out.blocks; // take the server's sanitized version back as the truth
    setCanvas(out.html);
    renderRail();
    renderInspector();
  } catch (err) {
    // ⚠ Clear it even here. The canvas is left stale and the message says to
    // reload — but leaving the flag set would silently stop every text edit on
    // the page from saving, which is a worse failure than the one that just
    // happened and looks like nothing at all.
    S.canvasStale = false;
    if (String(err && err.message) !== 'auth') toast('Could not redraw the page — reload to be safe');
  }
}

async function freshBlock(type) {
  var out = await api(API + '/new-block', { method: 'POST', body: JSON.stringify({ type: type }) });
  return out.block;
}

// ── autosave ───────────────────────────────────────────────────────────────
var saveTimer = null;
function scheduleSave() {
  S.dirty = true;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveDraft, 1500);
}
async function saveDraft() {
  clearTimeout(saveTimer);
  if (!S.dirty) return;
  try {
    var out = await api(API + '/page/' + encodeURIComponent(S.slug) + '/draft',
      { method: 'POST', body: JSON.stringify({ blocks: S.blocks, changes: S.changes }) });
    S.dirty = false;
    S.saved = now();
    S.status = out.status || S.status;
    renderTop();
  } catch (err) {
    if (String(err && err.message) === 'auth') return;
    toast('Could not save — your connection may be down');
  }
}

// Everything the editor holds that has not reached the server yet, written out
// before the page changes underneath it. Switching pages with an unsaved edit
// in the debounce window would otherwise silently lose it.
async function flushDraft() {
  clearTimeout(saveTimer);
  if (S.dirty) await saveDraft();
}

// Moving between pages is a real navigation, not a swap of state in place: the
// editor reboots on the new page, so nothing from the old one can leak into it.
async function goToPage(id) {
  S.leaving = true;
  await flushDraft();
  location.href = '/pages/' + encodeURIComponent(id) + '/edit';
}

// ── Page tab behavior ─────────────────────────────────────────────────────
// Page settings save on their own (debounced), separate from the block draft:
// they are not part of what Publish promotes, so treating them as draft edits
// would put a page permanently in "Draft edits" for changing its own name.
var pageSaveTimer = null;
function schedulePageSave(fields, immediate) {
  Object.assign(S.pageMeta, fields);
  S.savingPage = true;
  var saved = document.getElementById('edPageSaved');
  if (saved) saved.textContent = 'Saving\u2026';
  clearTimeout(pageSaveTimer);
  pageSaveTimer = setTimeout(savePageMeta, immediate ? 0 : 700);
}

async function savePageMeta() {
  clearTimeout(pageSaveTimer);
  try {
    var out = await api(API + '/page/' + encodeURIComponent(S.slug) + '/settings',
      { method: 'POST', body: JSON.stringify(S.pageMeta) });
    S.pageMeta = out.page;
    S.siblings = out.pages || S.siblings;
    S.path = out.page.slug;
    S.title = out.page.title;
    S.template = out.page.template;
    S.savingPage = false;
    // The address may have been cleaned up or made unique on the way in, and
    // the layout may have changed what the canvas should look like.
    if (out.rerender) { setCanvas(out.html); applySelection(); }
    renderTop();
    renderPagesRail();
    if (S.tab === 'page') renderInspector();
    if (out.redirected) toast('Old address will send visitors to the new one');
  } catch (err) {
    if (String(err && err.message) === 'auth') return;
    S.savingPage = false;
    toast('Could not save the page settings');
  }
}

function pageTabClick(e) {
  var opt = e.target.closest('[data-a="parent"]');
  if (opt) { schedulePageSave({ parent_id: opt.dataset.v || null }, true); return; }
  if (e.target.closest('#edPageDelete')) return deletePage();
}

function pageTabInput(e) {
  var t = e.target;
  if (t.id === 'edPageTitle') return schedulePageSave({ title: t.value });
  if (t.id === 'edPageSlug') return schedulePageSave({ slug: t.value });
  if (t.id === 'edPageInMenu') return schedulePageSave({ in_menu: t.checked ? 1 : 0 }, true);
  if (t.id === 'edPageTemplate') return schedulePageSave({ template: t.value }, true);
  if (t.id === 'edPageOwner') return schedulePageSave({ owner_username: t.value }, true);
  if (t.id === 'edPageSeo') {
    var c = document.getElementById('edSeoCount');
    if (c) {
      c.textContent = t.value.length + ' / ' + SEO_MAX;
      c.classList.toggle('is-over', t.value.length > SEO_MAX);
    }
    return schedulePageSave({ seo_description: t.value });
  }
}

async function deletePage() {
  if (S.pageMeta && S.pageMeta.locked) return;
  var name = (S.pageMeta && S.pageMeta.title) || 'this page';
  if (!confirm('Delete \u201C' + name + '\u201D and everything on it? Its address will start showing the "page not found" screen.')) return;
  try {
    await api(API + '/page/' + encodeURIComponent(S.slug) + '/delete', { method: 'POST', body: '{}' });
    S.leaving = true;
    S.dirty = false;
    location.href = '/pages';
  } catch (err) {
    if (String(err && err.message) === 'auth') return;
    toast('Could not delete this page');
  }
}

// Locked blocks belong to the site's design rather than to the page. The office
// can still take one out; a ministry leader edits around it.
function canRemove(id) {
  if (S.role === 'office') return true;
  var b = findBlock(id);
  return !b || !b.locked;
}

// ── block actions ──────────────────────────────────────────────────────────
function select(id) {
  // Clicking a block is a request to look at that block, so the panel comes
  // back from the Page tab on its own rather than leaving staff wondering why
  // nothing happened.
  if (id) S.tab = 'block';
  S.selectedId = id;
  applySelection();
  renderRail();
  renderInspector();
}

async function duplicateBlock(id) {
  var i = indexOfBlock(id);
  if (i < 0) return;
  var copy = JSON.parse(JSON.stringify(S.blocks[i]));
  copy.id = 'b' + Math.random().toString(36).slice(2, 12);
  pushHistory();
  S.blocks.splice(i + 1, 0, copy);
  S.selectedId = copy.id;
  note('Duplicated ' + def(copy.type).label.toLowerCase());
  await rerender();
  renderTop(); renderChanges(); scheduleSave();
  say('Duplicated ' + def(copy.type).label);
}

async function deleteBlock(id) {
  var b = findBlock(id);
  if (!b) return;
  if (!canRemove(id)) { toast('That part of the page is set by the church office'); return; }
  pushHistory();
  S.blocks = S.blocks.filter(function (x) { return x.id !== id; });
  S.selectedId = null;
  note('Deleted ' + def(b.type).label.toLowerCase());
  await rerender();
  renderTop(); renderChanges(); scheduleSave();
  say('Deleted ' + def(b.type).label + '. Undo is in the top bar.');
}

function toggleHide(id) {
  var b = findBlock(id);
  if (!b) return;
  patch(id, { hidden: !b.hidden }, (b.hidden ? 'Shown on phone: ' : 'Hidden on phone: ') + def(b.type).label.toLowerCase());
}

async function resetBlock(id) {
  var b = findBlock(id);
  if (!b) return;
  var fresh = await freshBlock(b.type);
  fresh.id = b.id;
  pushHistory();
  S.blocks = S.blocks.map(function (x) { return x.id === id ? fresh : x; });
  note('Reset ' + def(b.type).label.toLowerCase());
  await rerender();
  renderTop(); renderChanges(); scheduleSave();
}

// ⚠ NEITHER OF THESE MAY GO THROUGH pushHistory(), which clears the redo
// branch — stepping along the history is not a new edit, and routing them
// through it would make Undo destroy the thing Redo exists to reach.
async function undo() {
  if (!S.history.length) return;
  var prev = JSON.parse(S.history.pop());
  S.future.push(JSON.stringify(S.blocks));
  if (S.future.length > 40) S.future.shift();
  S.blocks = prev;
  // The block that was selected may not exist in the state being restored.
  S.selectedId = null;
  note('Undid last change');
  await rerender();
  renderTop(); renderChanges(); scheduleSave();
  say('Undid last change');
}

async function redo() {
  if (!S.future.length) return;
  var next = JSON.parse(S.future.pop());
  S.history.push(JSON.stringify(S.blocks));
  if (S.history.length > 40) S.history.shift();
  S.blocks = next;
  S.selectedId = null;
  note('Redid last change');
  await rerender();
  renderTop(); renderChanges(); scheduleSave();
  say('Redid last change');
}

// ── in-place text editing ──────────────────────────────────────────────────
// The canvas markup is authored by the Worker with the current values already
// in it, so there is nothing to "hydrate" on every keystroke and no controlled
// re-render to fight the caret with. Values are read back on blur and
// committed; the canvas is only redrawn for structural changes, which always
// happen with the field already blurred.
function commitField(node) {
  // Only genuine fields. `closest('[contenteditable]')` also matches the
  // contenteditable="false" toolbar, and a node detached by a re-render fires
  // focusout on its way out — either one would log a phantom text edit and
  // leave an extra step on the undo stack.
  if (!node || node.getAttribute('contenteditable') !== 'true') return;
  if (!node.dataset.field) return;
  if (!el.edPaper.contains(node)) return;
  // ⚠ A NODE IDENTIFIES ITS ITEM BY INDEX, AND A STRUCTURAL CHANGE MOVES THE
  // INDEX OUT FROM UNDER IT. Reordering a card while a heading has focus used
  // to overwrite a DIFFERENT card's heading: patch() reorders the array, then
  // renderInspector() restores focus into the panel, which fires focusout on
  // the heading — which is still on screen, because the canvas is redrawn by a
  // round trip to the Worker and has not come back yet. So this ran with the
  // old node's data-item="1" against a list where item 1 was now something
  // else, and wrote the wrong card's words over it. Silently: the canvas came
  // back correct a moment later, and only the SAVED draft was wrong.
  //
  // Nothing genuine is lost by dropping these. A person's own edit is already
  // committed by the focusout the control's own mousedown fires, before the
  // patch. Only a commit arriving AFTER the array moved reaches this, and that
  // one is reading a stale index by definition.
  if (S.canvasStale) return;
  var wrap = node.closest('.tlcb');
  if (!wrap) return;
  var b = findBlock(wrap.dataset.id);
  if (!b) return;
  var field = node.dataset.field;
  var itemIdx = node.dataset.item;
  var d = def(b.type);
  var isRich = itemIdx != null ? d.richItemFields.indexOf(field) > -1 : (d.richBody && field === 'body');
  var value = isRich ? node.innerHTML.trim() : node.textContent.trim();
  if (itemIdx != null) {
    var it = b.items[Number(itemIdx)];
    if (!it || it[field] === value) return;
    pushHistory();
    it[field] = value;
  } else {
    if (b[field] === value) return;
    pushHistory();
    b[field] = value;
  }
  note((field === 'stamp' ? 'Reworded the stamp on ' : 'Edited text in ') + d.label.toLowerCase());
  renderTop(); renderRail(); renderChanges();
  scheduleSave();
}

// ── inspector ──────────────────────────────────────────────────────────────
// ── the Page tab ───────────────────────────────────────────────────────────
function pageTabReadOnly(m) {
  var layouts = (S.config && S.config.templates) || [];
  var layout = layouts.filter(function (t) { return t.key === m.template; })[0] || {};
  return '' +
    '<div class="ed-sec ed-field"><span class="ed-lab">Page name</span>' +
      '<input type="text" id="edPageTitle" value="' + esc(m.title || '') + '" readonly></div>' +
    '<div class="ed-sec ed-field ed-sec--rule"><span class="ed-lab">Web address</span>' +
      '<input type="text" id="edPageSlug" value="timothystl.org' + esc(m.slug || '') + '" readonly></div>' +
    '<div class="ed-sec ed-field ed-sec--rule"><span class="ed-lab">Page layout</span>' +
      '<input type="text" id="edPageLayout" value="' + esc(layout.label || m.template || '') + '" readonly></div>' +
    '<div class="ed-sec ed-sec--rule">' +
      '<span class="ed-note">The name, address, menu placement and layout are set by the church office. ' +
      'Everything on the page itself is yours to change.</span>' +
    '</div>';
}

// Everything about the page rather than a block: what it is called, where it
// lives, whether it is in the menu, which layout it uses, and its search
// summary. Renaming regenerates the address and leaves a redirect behind, so
// the one thing a volunteer could break — an inbound link — is handled for
// them rather than left to be remembered.
var SEO_MAX = 160;

function pageTabHtml() {
  var m = S.pageMeta || {};
  // A ministry leader edits their page's content, not the site's structure.
  // The fields still show what is true — they are just not theirs to change.
  if (S.role !== 'office') return pageTabReadOnly(m);
  var isHome = m.slug === '/';
  var parents = (S.siblings || []).filter(function (p) { return !p.parent_id && p.id !== S.slug; });
  var desc = m.seo_description || '';
  var over = desc.length > SEO_MAX;
  var layouts = (S.config && S.config.templates) || [];

  var menuOpts = '<button type="button" class="ed-menu-opt" data-a="parent" data-v=""' +
    ' aria-pressed="' + (!m.parent_id ? 'true' : 'false') + '">Top level of the menu</button>' +
    parents.map(function (p) {
      return '<button type="button" class="ed-menu-opt" data-a="parent" data-v="' + esc(p.id) + '"' +
        ' aria-pressed="' + (m.parent_id === p.id ? 'true' : 'false') + '">Under ' + esc(p.title) + '</button>';
    }).join('');

  return '' +
    '<div class="ed-sec ed-field">' +
      '<span class="ed-lab">Page name</span>' +
      '<input type="text" id="edPageTitle" value="' + esc(m.title || '') + '" maxlength="80">' +
      '<span class="ed-note">This is the name people see in the menu.</span>' +
    '</div>' +
    '<div class="ed-sec ed-field ed-sec--rule">' +
      '<span class="ed-lab">Web address</span>' +
      '<div class="ed-addr"><span>timothystl.org</span>' +
        '<input type="text" id="edPageSlug" value="' + esc(m.slug || '') + '"' + (isHome ? ' readonly' : '') + '></div>' +
      '<span class="ed-note">' + (isHome
        ? 'The homepage always lives at the root.'
        : 'Set from the page name. Change it only if you must \u2014 old links stop working, though we will send them on for you.') + '</span>' +
    '</div>' +
    '<div class="ed-sec ed-sec--rule">' +
      '<span class="ed-lab">Where it sits in the menu</span>' +
      '<div class="ed-menu-opts">' + menuOpts + '</div>' +
      '<label class="ed-check"><input type="checkbox" id="edPageInMenu"' + (m.in_menu ? ' checked' : '') + '>' +
        'Show this page in the menu</label>' +
    '</div>' +
    '<div class="ed-sec ed-field ed-sec--rule">' +
      '<span class="ed-lab">Page layout</span>' +
      '<select id="edPageTemplate">' + layouts.map(function (t) {
        return '<option value="' + esc(t.key) + '"' + (t.key === m.template ? ' selected' : '') + '>' + esc(t.label) + '</option>';
      }).join('') + '</select>' +
      '<span class="ed-note" id="edPageTemplateHint">' + esc((layouts.find(function (t) { return t.key === m.template; }) || {}).hint || '') + '</span>' +
    '</div>' +
    '<div class="ed-sec ed-field ed-sec--rule">' +
      '<div class="ed-lab-row"><span class="ed-lab">Search summary</span>' +
        '<span class="ed-count' + (over ? ' is-over' : '') + '" id="edSeoCount">' + desc.length + ' / ' + SEO_MAX + '</span></div>' +
      '<textarea id="edPageSeo" rows="3">' + esc(desc) + '</textarea>' +
      '<span class="ed-note">The sentence Google shows under the page title.</span>' +
    '</div>' +
    (S.role === 'office' ? '<div class="ed-sec ed-field ed-sec--rule">' +
      '<span class="ed-lab">Who can edit this page</span>' +
      '<select id="edPageOwner">' +
        '<option value=""' + (!m.owner_username ? ' selected' : '') + '>Anyone in the church office</option>' +
