name = "tlc-newsletter-admin"
main = "website-admin-worker.js"
compatibility_date = "2024-01-01"

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

# Used only to verify the Cf-Access-Jwt-Assertion header Finance's app forwards on a
# payroll-proxy call (see admin/payroll-contract-auth.js) -- proves WHO Finance says is
# acting, not whether the call itself is authorized (that's FINANCE_PAYROLL_CONTRACT_KEY,
# a real secret, set via the dashboard). Neither value below is a secret: they identify
# which Cloudflare Access application's public keys to check against.
[vars]
FINANCE_ACCESS_TEAM_DOMAIN = "timothystl.cloudflareaccess.com"
# Comma-separated: production Finance (finance.timothystl.org, same AUD Connect's wrangler.toml
# uses) and staging Finance. Both relay payroll calls to this one Worker.
FINANCE_ACCESS_AUD = "74de33dfe1e65b4eea9b8bf51e04d654e470a60773175bf34d74d55e940b66eb,3c8cae1345ea2e2e15a88e01d7801c27ec7a57bfb73952098bd4b1929ab01717"

# Repointed 2026-09-15: Connect's Worker was renamed tlc-chms -> timothy-connect in place via
# the Cloudflare dashboard (same underlying script id, confirmed before/after via the Workers
# API -- routes/bindings/cron on Connect's own side were untouched). This binding targets by
# name, not id, so it needed its own matching update here -- without it, every contact/prayer
# form forward (admin/forms.js's deliverChmsRow) and the Christmas Market volunteer-signup
# toggle (admin/market.js) would silently fail against a name that no longer resolves, retried
# and failed repeatedly out of chms_forward_outbox rather than erroring visibly to a visitor.
[[services]]
binding = "CONNECT_WORKER"
service = "timothy-connect"

[[d1_databases]]
binding = "DB"
database_name = "tlc-newsletter-db"
database_id = "7feda7f2-abf5-4756-9c15-9bb1c9a6c331"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "tlc-news-images"

# Promotes ministry pages whose scheduled publish time has come
# (see promoteScheduledPages in website-admin-worker.js). Quarter-hourly so a page
# scheduled for "6:00 am" goes live within 15 minutes of that, not an hour.
[triggers]
crons = ["*/15 * * * *"]
