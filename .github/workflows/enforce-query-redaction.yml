name: Enforce query-string redaction
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed main revision containing the redaction operation
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: observability-query-redaction
  cancel-in-progress: false
jobs:
  redact:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Verify selected revision
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify allowlisted operation before using credentials
        run: node --test admin/query-redaction.test.mjs
      - name: Enable and verify redaction for the reviewed non-childcare services
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node .github/scripts/enforce-query-redaction.mjs
