name: Tests

# The repo had no pull-request CI at all until now: deploy.yml only fires on
# push to main, so a pull request reported no checks and every suite was a
# local step somebody had to remember. This runs the Node suites on every PR
# and on main.
#
# Only the suites that need no browser run here. The Playwright suites in
# test/ (editor*, site-*, whole-page, public-page, list-section) drive real
# Chromium and are left out deliberately rather than half-wired — see the note
# at the bottom of this file.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  node-tests:
    name: Node test suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # node:sqlite — which admin/forms.test.mjs and test/admin-redesign.test.mjs
      # use as the D1 stand-in — needs Node 22.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # A parse error in the Worker is worth catching before any suite runs,
      # since most of them import it and would fail with a less obvious message.
      - name: Syntax-check the workers and admin modules
        run: |
          node --check tlc-admin-worker.js
          node --check site-worker.js
          node --check tlc-links-worker.js
          node --check give-landing.js
          node --check give-link.js
          for f in admin/*.js; do node --check "$f"; done

      # ⚠ `node --check` is NOT enough on its own, and believing it was cost
      # real time. It parses these files as CommonJS scripts. Most of the CSS
      # and client-side JS in this repo lives inside template literals, and a
      # stray backtick in one of those — a comment quoting `flex:1`, say —
      # terminates the literal and breaks the MODULE while still parsing fine
      # as a script. Verified: --check passed on a gym.js that could not be
      # imported at all.
      #
      # So import each one for real. These modules are declarations and a
      # config object at the top level, so importing them runs nothing.
      - name: Import every admin module as ESM
        run: |
          set -e
          for f in admin/*.js; do
            node -e "import('./$f').catch(e => { console.error('$f: ' + e.message); process.exit(1); })"
          done

      # Globbed rather than listed. A named list goes stale the moment somebody
      # adds a suite — which happened the first time this workflow met a new
      # one — and a suite that silently never runs is worse than no suite.
      # Every admin/*.test.mjs runs under plain node; the browser suites live in
      # test/ and are covered by the note at the bottom of this file.
      - name: Admin module suites
        run: |
          set -e
          shopt -s nullglob
          for f in admin/*.test.mjs; do
            echo "── $f"
            node "$f"
          done

      # Boots the real Worker against SQLite and requests every redesigned
      # screen. test/html-loader.mjs is what makes the Worker importable in
      # Node at all — it uses Wrangler's `import x from './y.html'` syntax,
      # which Node has no format for.
      - name: Admin routes, against the real Worker
        run: node --experimental-loader ./test/html-loader.mjs test/admin-redesign.test.mjs

      # The site worker's own suite. It lives in test/ with the browser ones but
      # needs no browser — it drives site-worker.js directly with fetch stubbed.
      # Named rather than globbed because everything else in test/ does need
      # Chromium; see the note at the bottom.
      - name: Site worker
        run: node test/site-taps.test.mjs

      # The links page, same shape: drives tlc-links-worker.js directly with
      # the admin API stubbed. Covers which cards each tap shows, and the
      # sign-up card that has no address to check.
      - name: Links page
        run: node test/links-page.test.mjs

      # The giving page, and the only question worth asking about it: does it
      # still TAKE MONEY. Drives site-worker.js with the admin stubbed and
      # asserts the arithmetic ($25 becomes amount=2500, in cents), that a fund
      # override replaces the base link's fundId rather than adding a second,
      # that neither giving block can store a Tithe.ly address even when one is
      # posted at it, and that the page still transacts when it is unpublished,
      # when the admin is unreachable, and when the admin returns nonsense.
      - name: The giving page still transacts
        run: node test/give-page.test.mjs

# Not run here, and why:
#
# The Playwright suites need a Chromium binary. Adding it is a real change in
# what this workflow costs and how long a PR waits, and several of those suites
# take minutes each, so wiring them up is a deliberate decision rather than
# something to slip in alongside the Node ones. Run them locally:
#
#   node test/shell-layout.test.mjs      # the shell, MEASURED — see below
#   node --experimental-loader ./test/html-loader.mjs test/gym-portal.test.mjs
#                                        # the renter portal at 390px — the
#                                        # device it is actually opened on
#   node test/list-section.test.mjs      # the shared list pattern
#   node test/editor.test.mjs            # the block editor shell
#   node test/site-editor.test.mjs       # the pages rail and Page tab
#   node test/public-page.test.mjs       # the live site
#   node test/public-phone.test.mjs      # [B8] tap targets at 390px, MEASURED
#   node test/payroll.test.mjs           # payroll, against a stubbed Supabase
#   node test/rich-field.test.mjs        # rich fields open on demand — see below
#   node test/tinymce-selfhost.test.mjs  # the vendored TinyMCE BOOTS — see below
#   ... and editor-edit, editor-dnd, editor-media, editor-publish,
#       editor-resize, editor-sections, site-roles, site-pages, whole-page
#
# Chromium is at /opt/pw-browsers/chromium in the Claude Code environment, or
# set CHROME_PATH.
#
# ⚠ tinymce-selfhost is the one to run after touching public/tinymce/, the
# plugin lists, or the loader. TinyMCE is self-hosted now, so a missing file
# is not a 404: wrangler-site.toml's single-page-application not_found
# handling returns index.html with a 200, and the browser feeds an HTML
# document into a <script> tag. This suite boots the real library off the
# repo's own files and asserts every /tinymce/ response is JS or CSS rather
# than HTML — verified by deleting theme.min.js, which fails it with the
# genuine symptom, SyntaxError: Unexpected token '<'. The parts that need no
# browser (every file present, no config naming a plugin we did not vendor)
# are in admin/tinymce-assets.test.mjs, which DOES run above.
#
# ⚠ rich-field is the one to run after any change to tinymceField or
# RICH_FIELD_JS. TinyMCE Cloud bills per editor instance that finishes
# initialising, so a field that quietly goes back to initialising at page
# load is a bill, not a visible bug — and the same suite covers the other
# half, that a field nobody opened still submits exactly what it held. It
# stubs TinyMCE and never fetches the real library, so running it costs no
# editor loads against the church's account.
#
# ⚠ public-phone is the one to run after any change to public/styles.css. The
# backlog asked for "a tap-through on a real phone"; a person doing that tells
# you about the day they did it, and this tells you on every change. It found
# footer links 14px tall, a 36px hamburger and six buttons under 44px — none of
# which looked wrong on a desktop, which is the whole point.
#
# ⚠ shell-layout is the one worth running by hand after ANY change to the
# sidebar or the page shell. Three separate releases have shipped an admin with
# no working navigation on a phone — off-canvas with no handler, then a handler
# with no markup, then a hamburger whose display:none was declared after the
# media query and so won at every width. Every one of those passed a CSS grep.
# None would have passed a browser that was asked to click the thing.
