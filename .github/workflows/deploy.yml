name: Deploy TLC Website

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:

  # ── PRODUCTION ────────────────────────────────────────────────────────────
  # Deploys all production workers on push to main or manual trigger.

  deploy-site:
    name: Deploy main site (timothystl.org)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Deploy main site worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: wrangler deploy --config wrangler-site.toml

  deploy-admin:
    name: Deploy newsletter admin (admin.timothystl.org)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Create R2 image bucket (if not exists)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: wrangler r2 bucket create tlc-news-images 2>&1 || true

      - name: Deploy admin worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: wrangler deploy

  deploy-links:
    name: Deploy links page (links.timothystl.org)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Deploy links worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: wrangler deploy --config wrangler-links.toml

  bump-version:
    name: Bump admin version number
    needs: [deploy-site, deploy-admin, deploy-links]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Increment version, commit, and redeploy admin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Read current version from helpers.js (e.g. 'v1.76.3').
          # Auto-bump is patch-only; major and minor are intentionally manual
          # so the version number means something. To cut a minor or major
          # release, edit admin/helpers.js by hand before merging.
          CURRENT=$(grep "export const VERSION = " admin/helpers.js | sed "s/.*'\(.*\)'.*/\1/")

          # Strip leading 'v' and split on '.'. If the current version is
          # still in the old two-segment form (e.g. 'v1.76'), treat it as
          # 'v1.76.0' so we land on 'v1.76.1' the first run.
          STRIPPED=${CURRENT#v}
          MAJOR=$(echo "$STRIPPED" | awk -F. '{print $1+0}')
          MINOR=$(echo "$STRIPPED" | awk -F. '{print $2+0}')
          PATCH=$(echo "$STRIPPED" | awk -F. '{print ($3=="" ? 0 : $3+0)}')
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="v${MAJOR}.${MINOR}.${NEW_PATCH}"

          sed -i "s/export const VERSION = '${CURRENT}'/export const VERSION = '${NEW_VERSION}'/" admin/helpers.js

          echo "Bumped: ${CURRENT} → ${NEW_VERSION}"

          # Redeploy admin with the new version baked in
          wrangler deploy

          # Commit and push the version bump (skip ci prevents re-triggering)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add admin/helpers.js
          git commit -m "Bump version to ${NEW_VERSION} [skip ci]"
          git push
