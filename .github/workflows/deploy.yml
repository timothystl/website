name: Deploy TLC Website

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

# Hold the lock across ALL production writes, including versioning. Never
# cancel halfway through a release. Pending runs may be reordered by GitHub;
# prepare-release.sh rejects any whose checkout is no longer current main.
concurrency:
  group: website-production-release
  cancel-in-progress: false

jobs:
  release:
    name: Release Site, Admin, and Links from one revision
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare immutable release and skip superseded runs
        id: release
        run: bash .github/scripts/prepare-release.sh
      - name: Install Wrangler
        if: steps.release.outputs.deploy == 'true'
        run: npm install -g wrangler@4.130.0
      - name: Deploy all production Workers from the recorded revision
        if: steps.release.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test -z "$(git status --porcelain)"
          wrangler deploy --config wrangler-site.toml
          wrangler deploy --config wrangler.toml
          wrangler deploy --config wrangler-links.toml
          echo "Released Site, Admin, and Links from $RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
