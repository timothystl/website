name: Advent devotional

# Builds the page-turning Advent booklet (advent/) and publishes it to the
# Cloudflare Pages project "timothy-advent". Separate from the website release:
# replacing the PDF never redeploys the website Workers.
#
# Pull requests: build + tests only. Push to main touching advent/: publish.
# Needs repository secret CLOUDFLARE_API_TOKEN with "Cloudflare Pages: Edit",
# and (if the token can see more than one account) secret CLOUDFLARE_ACCOUNT_ID.

on:
  pull_request:
    paths: ['advent/**', '.github/workflows/advent.yml']
  push:
    branches: [main]
    paths: ['advent/**', '.github/workflows/advent.yml']
  workflow_dispatch:

concurrency:
  group: advent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: advent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PDF tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Build from the booklet PDF
        run: npm run build
      - name: Publish to Cloudflare Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -n "${ACCOUNT_ID}" ]; then export CLOUDFLARE_ACCOUNT_ID="${ACCOUNT_ID}"; fi
          npx --yes wrangler@4.130.0 pages project list | grep -q 'timothy-advent' \
            || npx --yes wrangler@4.130.0 pages project create timothy-advent --production-branch=main
          npx --yes wrangler@4.130.0 pages deploy dist --project-name=timothy-advent --branch=main --commit-dirty=true
          echo "Published https://timothy-advent.pages.dev from ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
