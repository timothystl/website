name: Migrate tlc-news-images R2 data to timothy-website-images

# Data-copy step of the Website Admin naming cleanup, same shape as migrate-d1-database.yml and
# Connect's migrate-photos-r2.yml. Cloudflare cannot rename an R2 bucket in place, so
# tlc-news-images -> timothy-website-images is: create the new bucket (this workflow does it if
# missing) -> copy live objects (this workflow) -> repoint wrangler.toml's bucket_name in a
# separate PR -> the normal release -> verify -> delete the old bucket once confirmed. This
# workflow only creates and fills the new bucket; it never deletes anything, so it is safe to
# re-run to catch up on newer uploads. The IMAGES binding name does not change.

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full main commit SHA approved for this data-copy exercise
        required: true
        type: string
      reason:
        description: Reason for this migration run
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: images-r2-migration
  cancel-in-progress: false

jobs:
  migrate:
    name: Copy tlc-news-images objects into timothy-website-images
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      # Bucket lifecycle goes through wrangler with the ordinary R2 API token; object-level
      # list/copy is S3-protocol-only for R2, so it uses the R2 access key pair. That key pair
      # must be able to read the old bucket and write the new one (see docs/NAMING-CUTOVER.md).
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_RECOVERY_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_RECOVERY_SECRET_ACCESS_KEY }}
      SOURCE_BUCKET: tlc-news-images
      DEST_BUCKET: timothy-website-images
      RESULT_FILE: /tmp/r2-images-migration-result.json
    steps:
      - name: Check out the approved commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.expected_sha }}

      - name: Verify the approved commit is on main
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git merge-base --is-ancestor "$EXPECTED_SHA" origin/main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # No package.json in this repo -- installed globally, same as deploy.yml.
      - name: Install wrangler
        run: npm install -g wrangler@4.130.0

      - name: Ensure the AWS CLI is available
        run: command -v aws >/dev/null || (curl -sS "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip && unzip -q /tmp/awscliv2.zip -d /tmp && sudo /tmp/aws/install)

      # If the token cannot create buckets, create timothy-website-images by hand in the
      # dashboard and re-run.
      - name: Create the destination bucket if it does not exist yet
        shell: bash
        run: |
          set -euo pipefail
          if ! wrangler r2 bucket info "$DEST_BUCKET" >/dev/null 2>&1; then
            wrangler r2 bucket create "$DEST_BUCKET"
          fi

      - name: Copy objects from tlc-news-images to timothy-website-images
        run: bash scripts/migrate-r2-bucket.sh

      - name: Record migration summary
        if: always()
        shell: bash
        env:
          MIGRATION_REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          if [[ ! -s "$RESULT_FILE" ]]; then
            echo '## tlc-news-images -> timothy-website-images data copy' >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo '- The copy script did not produce a result file (failed before completing any phase). Check the job logs.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo '## tlc-news-images -> timothy-website-images data copy'
            echo
            echo "- Approved commit: \`${GITHUB_SHA}\`"
            echo "- Reason: ${MIGRATION_REASON}"
            jq -r '
              "- Source objects found: " + (.source_objects_found | tostring) + " (" + (.source_bytes | tostring) + " bytes)",
              "- Sync completed without error: " + (.sync_completed_without_error | tostring),
              "- Destination object count after copy: " + (.dest_object_count_after | tostring),
              "- Objects not yet matched in destination by key/etag/size: " + (.objects_not_yet_matched_in_dest | tostring) + " (converged: " + (.dest_count_verified | tostring) + ")",
              "- \"Sync completed without error\" is authoritative for whether the copy succeeded; the match count is best-effort and never fails this run on its own -- the source stays live and writable throughout",
              "- Source bucket left unmodified: " + (.source_bucket_modified | tostring),
              "- Object keys (filenames) were not printed or retained as artifacts",
              (if (.first_failure_diagnostic // "") != "" then "- First-failure diagnostic (long token-like strings redacted):\n```\n" + .first_failure_diagnostic + "\n```" else empty end)
            ' "$RESULT_FILE"
          } >> "$GITHUB_STEP_SUMMARY"
